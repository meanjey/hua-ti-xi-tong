<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>刷题系统</title>
<style>
:root{
  color-scheme:light dark;
  --serif:"Songti SC","STSongti-SC","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --bg:#FAF7F1; --surface:#FFFDF8; --surface-2:#F4EFE4; --surface-3:#E9E1CF;
  --text:#1C1917; --dim:#6B6660; --dim-2:#A79E8D;
  --border:#E7E0D2; --line:#E7E0D2;
  --accent:#C63A1E; --accent-soft:rgba(198,58,30,.07); --accent-line:rgba(198,58,30,.38);
  --green:#33604A; --green-soft:rgba(51,96,74,.08); --green-line:rgba(51,96,74,.38);
  --red:#C63A1E; --red-soft:rgba(198,58,30,.07);
  --bar-bg:#FAF7F1;
  --shadow-pop:0 16px 44px rgba(28,25,23,.16);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#171410; --surface:#201B15; --surface-2:#28221A; --surface-3:#383023;
    --text:#F2ECDF; --dim:#ABA08D; --dim-2:#6F6655;
    --border:rgba(231,224,210,.16); --line:rgba(231,224,210,.16);
    --accent:#C63A1E; --accent-soft:rgba(198,58,30,.18); --accent-line:rgba(216,90,58,.55);
    --green:#8FB49C; --green-soft:rgba(143,180,156,.13); --green-line:rgba(143,180,156,.42);
    --red:#C63A1E; --red-soft:rgba(198,58,30,.18);
    --bar-bg:#171410;
    --shadow-pop:0 16px 44px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  font-size:16px; line-height:1.5;
}
body.font-large{font-size:17.5px}
::selection{background:var(--accent);color:#FFFDF8}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button,[role="button"],select,input:not([type="checkbox"]){min-height:44px}
input[type="range"]{min-height:44px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
#app{max-width:680px;margin:0 auto;padding:0 18px calc(96px + env(safe-area-inset-bottom));counter-reset:sec}
h1.large{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:.02em;margin:26px 2px 6px}
.sub{color:var(--dim);font-size:13.5px;letter-spacing:.05em;margin:0 2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px}
.mt{margin-top:16px}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.btn-primary{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--accent);color:#FFFDF8;font-weight:600;font-size:16.5px;letter-spacing:.05em;
  border-radius:6px;padding:14px 16px;min-height:52px;
}
.btn-primary:active{opacity:.85}
.btn-primary:disabled{background:var(--surface-3);color:var(--dim)}
.btn-ghost{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--surface);border:1px solid var(--line);color:var(--text);font-weight:500;font-size:15px;
  border-radius:6px;padding:10px 14px;min-height:44px;
}
.btn-ghost:active{background:var(--surface-2)}
.btn-danger-ghost{background:var(--red-soft);color:var(--red);border-color:transparent}
.link{color:var(--accent);font-size:15px;font-weight:600;padding:8px 4px;min-height:44px;display:inline-flex;align-items:center}
.icon-btn{width:44px;height:44px;border-radius:6px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--dim);flex:none}
.icon-btn:active{background:var(--surface-2)}
svg.ic{width:22px;height:22px;flex:none}
svg.ic.sm{width:17px;height:17px}
svg.ic.lg{width:26px;height:26px}

/* progress ring + stats */
.ring-wrap{display:flex;align-items:center;gap:20px}
.ring-num{font-family:var(--serif);font-size:34px;font-weight:600}
.ring-lab{color:var(--dim);font-size:13px;margin-top:2px}
.stat-row{display:flex;gap:8px}
.stat{flex:1;border:1px solid var(--line);border-radius:6px;padding:9px 6px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:21px;font-weight:600}
.stat span{font-size:12px;color:var(--dim)}

/* mode grid */
.mode-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mode-cell{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 4px 13px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px;font-weight:500;min-height:86px;justify-content:center}
.mode-cell svg{color:var(--dim)}
.mode-cell:active{background:var(--surface-2)}
.mode-cell .cnt{font-family:var(--serif);font-size:12px;color:var(--dim-2)}
.exam-entry{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;margin-top:12px}
.exam-entry:active{background:var(--surface-2)}
.exam-entry .ic-wrap{width:46px;height:46px;border-radius:6px;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.exam-entry .chev{color:var(--dim-2);flex:none}

/* banner */
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:14px;margin-top:16px}
.banner p{margin:0;font-size:14px;flex:1;line-height:1.55}
.banner p b{font-weight:600}
.banner .x{color:var(--dim-2);width:36px;height:36px;min-height:36px;display:flex;align-items:center;justify-content:center;flex:none}

/* segmented + chips + search */
.searchbar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0 12px;margin-top:14px;color:var(--dim)}
.searchbar input{flex:1;border:0;background:none;font:inherit;color:var(--text);outline:none;min-height:44px}
.searchbar input::placeholder{color:var(--dim-2)}
.segmented{display:flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px;margin-top:12px}
.segmented button{flex:1;border-radius:4px;font-size:14px;font-weight:500;color:var(--dim);min-height:36px}
.segmented button.on{background:var(--text);color:var(--bg);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 13px;font-size:14px;min-height:40px;display:inline-flex;align-items:center;color:var(--dim)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}

/* section label: editorial numbered rule */
.group-lab{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:.16em;color:var(--text);margin:30px 2px 12px;counter-increment:sec}
.group-lab::before{content:counter(sec,decimal-leading-zero);font-family:var(--serif);font-size:13px;letter-spacing:.04em;color:var(--accent)}
.group-lab::after{content:"";flex:1;height:1px;background:var(--line)}

/* directory list */
.glist{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.grow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px;min-height:56px;position:relative;background:transparent}
.grow:active{background:var(--surface-2)}
.grow + .grow::before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--line)}
.grow .qn{font-family:var(--serif);color:var(--dim);font-size:13.5px;width:40px;flex:none}
.grow .stem{flex:1;font-size:15px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grow .st{font-size:12px;color:var(--dim);flex:none;text-align:right}
.grow .st.bad{color:var(--accent);font-weight:600}
.grow .chev{color:var(--dim-2);flex:none}

/* tab bar: paper, hairline top, no glass */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--bar-bg);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
#tabbar .in{max-width:680px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:11px;letter-spacing:.1em;color:var(--dim);min-height:52px;position:relative}
.tab.on{color:var(--accent);font-weight:600}
.tab.on::before{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:24px;height:2px;background:var(--accent)}
.tab .bdg{position:absolute;top:4px;left:calc(50% + 2px);background:var(--accent);color:#FFFDF8;font-size:10px;font-weight:700;border-radius:999px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* quiz */
.quiz-top{position:sticky;top:0;z-index:30;margin:0 -18px;padding:10px 18px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.quiz-top .bar{height:3px;background:var(--surface-3);overflow:hidden;margin-top:10px}
.quiz-top .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qmeta{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12.5px;letter-spacing:.05em;margin:18px 2px 10px}
.qstem{font-size:19.5px;font-weight:600;line-height:1.62}
body.font-large .qstem{font-size:21px}
.qimg{width:100%;border-radius:6px;margin-top:14px;background:var(--surface);border:1px solid var(--line)}
.opts{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:15px 16px;font-size:16px;line-height:1.55;min-height:56px}
.opt .k{font-family:var(--serif);width:27px;height:27px;border-radius:4px;border:1px solid var(--line);background:var(--surface-2);color:var(--dim);font-size:14.5px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.opt.sel{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:#FFFDF8}
.opt.ok{background:var(--green-soft);border-color:var(--green-line)}
.opt.ok .k{background:var(--green);border-color:var(--green);color:#FFFDF8}
.opt.bad{background:var(--red-soft);border-color:var(--accent-line)}
.opt.bad .k{background:var(--accent);border-color:var(--accent);color:#FFFDF8}
.opt.dim{opacity:.45}
.opt .mark{margin-left:auto;flex:none;margin-top:2px}
.judge-row{display:flex;gap:10px;margin-top:20px}
.judge-btn{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:62px;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.judge-btn.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
.judge-btn.ok{background:var(--green-soft);border-color:var(--green-line);color:var(--text)}
.judge-btn.bad{background:var(--red-soft);border-color:var(--accent-line)}
.judge-btn.dim{opacity:.45}
.feedback{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px}
.feedback .fh{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16.5px}
.feedback .dot{width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;flex:none}
.feedback .dot.ok{color:var(--green)}
.feedback .dot.bad{color:var(--accent)}
.feedback .ans{margin-top:11px;font-size:15px;line-height:1.6}
.feedback .ans b{font-weight:600}
.feedback .corr{margin-top:10px;font-family:var(--serif);color:var(--dim);font-size:15.5px;line-height:1.7;border-left:2px solid var(--line);padding-left:12px}
.feedback .note{margin-top:9px;color:var(--dim-2);font-size:12.5px;line-height:1.55}
.fix-tag{flex:none;font-family:var(--serif);font-size:11px;line-height:1;color:var(--accent);border:1px solid var(--accent-line);border-radius:3px;padding:3px 5px 2px;letter-spacing:.1em}
.fixnote{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-family:var(--serif);font-size:13px;line-height:1.65;color:var(--dim)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.grade{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 2px 8px;min-height:56px;display:flex;flex-direction:column;align-items:center;gap:1px}
.grade b{font-size:15px;font-weight:600}
.grade span{font-family:var(--serif);font-size:11.5px;color:var(--dim)}
.grade.rec{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.grade.rec b{color:var(--accent)}
.grade.rec span{color:var(--accent);opacity:.8}
.grade:active{background:var(--accent);color:#FFFDF8}
.grade:active span{color:rgba(255,253,248,.8)}
.quiz-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bar-bg);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom))}
.quiz-nav .in{max-width:644px;margin:0 auto;display:flex;gap:10px}
.nav-btn{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:50px;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px}
.nav-btn:disabled{color:var(--dim-2);background:var(--surface-2);border-color:transparent}
.nav-btn.main{background:var(--accent);color:#FFFDF8;border-color:var(--accent)}
.nav-btn.main:disabled{background:var(--surface-3);color:var(--dim);border-color:transparent}

/* answer card drawer + sheets */
.overlay{position:fixed;inset:0;background:rgba(23,20,16,.42);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:88vh;overflow-y:auto;border-radius:10px 10px 0 0;border-top:1px solid var(--line);padding:10px 18px calc(20px + env(safe-area-inset-bottom));animation:sheet-up .28s cubic-bezier(.32,.72,0,1) both}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--surface-3);margin:2px auto 12px}
.sheet h2{font-family:var(--serif);font-size:21px;font-weight:600;margin:2px 0 6px}
@keyframes sheet-up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes q-in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes q-in-b{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes page-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.anim-page{animation:page-in .22s ease-out both}
.anim-q{animation:q-in .22s ease-out both}
.anim-q-b{animation:q-in-b .22s ease-out both}
@media (prefers-reduced-motion: reduce){.anim-page,.anim-q,.anim-q-b,.sheet{animation:none}}
.cardgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.cell{aspect-ratio:1;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--dim);font-family:var(--serif);font-size:14.5px;display:flex;align-items:center;justify-content:center;position:relative;min-height:44px}
.cell.ok{background:var(--green-soft);color:var(--green);border-color:var(--green-line);font-weight:600}
.cell.bad{background:var(--red-soft);color:var(--accent);border-color:var(--accent-line);font-weight:600}
.cell.cur{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent);color:var(--text)}
.cell .flg{position:absolute;top:3px;right:4px;width:9px;height:9px;color:var(--accent)}
.filter-row{display:flex;gap:8px;margin-top:6px}
.filter-row button{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:6px;font-size:13.5px;min-height:40px;font-weight:500;color:var(--dim)}
.filter-row button.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}

/* settings rows */
.set-group{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.set-row{display:flex;align-items:center;gap:10px;padding:12px 16px;min-height:56px;position:relative;width:100%;text-align:left;background:transparent}
.set-row + .set-row::before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--line)}
.set-row .lab{flex:1;font-size:15.5px}
.set-row .val{color:var(--dim);font-size:15px}
.set-row button.val{color:var(--accent);font-weight:500}
.stepper{display:flex;align-items:center;gap:2px}
.stepper button{width:40px;height:40px;min-height:40px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:19px;display:flex;align-items:center;justify-content:center}
.stepper .n{min-width:44px;text-align:center;font-family:var(--serif);font-weight:600;font-size:17px}
.seg-sm{display:flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px}
.seg-sm button{border-radius:4px;font-size:13.5px;padding:0 12px;min-height:38px;font-weight:500;color:var(--dim)}
.seg-sm button.on{background:var(--text);color:var(--bg);font-weight:600}
select.picker{font:inherit;color:var(--accent);background:none;border:0;font-weight:500;text-align:right;min-height:44px}
input[type="range"]{width:100%;accent-color:var(--accent)}
.modal-wrap{position:fixed;inset:0;background:rgba(23,20,16,.42);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;max-width:400px;width:100%;padding:22px 20px 16px;box-shadow:var(--shadow-pop)}
.modal h3{font-family:var(--serif);margin:0 0 8px;font-size:19px;font-weight:600;text-align:center}
.modal p{margin:0;color:var(--dim);font-size:14.5px;line-height:1.65;text-align:center}
.modal .acts{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.modal .acts button{border-radius:6px;min-height:50px;font-weight:600;font-size:16px;background:var(--surface-2)}
.modal .acts button.pri{background:var(--accent);color:#FFFDF8}
.modal .acts button.dng{background:var(--accent);color:#FFFDF8}

/* heatmap + forecast */
.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:3.5px;margin-top:12px}
.heat i{aspect-ratio:1;border-radius:2px;background:var(--surface-3)}
.heat i.l1{background:rgba(28,25,23,.16)} .heat i.l2{background:rgba(28,25,23,.34)} .heat i.l3{background:rgba(28,25,23,.58)} .heat i.l4{background:var(--text)}
@media (prefers-color-scheme: dark){.heat i.l1{background:rgba(242,236,223,.18)}.heat i.l2{background:rgba(242,236,223,.36)}.heat i.l3{background:rgba(242,236,223,.6)}}
.fcast{display:flex;gap:6px;margin-top:12px}
.fcast .d{flex:1;text-align:center;border:1px solid var(--line);border-radius:6px;padding:9px 2px}
.fcast .d b{display:block;font-family:var(--serif);font-size:17px;font-weight:600}
.fcast .d span{font-size:11px;color:var(--dim)}
.big-stat{display:flex;gap:8px}
.big-stat .stat b{font-size:25px}
.empty{color:var(--dim);text-align:center;padding:34px 10px;font-size:15px;line-height:1.6}
.wrong-detail{padding:2px 16px 16px 68px;font-size:14.5px;color:var(--dim);line-height:1.65}
.wrong-detail b{color:var(--text)}
.result-hero{text-align:center;padding:30px 0 8px}
.result-hero .score{font-family:var(--serif);font-size:56px;font-weight:600}
.dist{display:flex;gap:8px;margin-top:12px}
.dist .d{flex:1;border:1px solid var(--line);border-radius:6px;padding:10px 2px;text-align:center}
.dist .d b{display:block;font-family:var(--serif);font-size:19px;font-weight:600}
.dist .d span{font-size:11.5px;color:var(--dim)}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<div id="tabbar"></div>
<div id="layer"></div>
<script>

钱塘江五大水系。","answer":false,"correction":"沟通了海河、黄河、淮河、长江、钱塘江五大水系。"},{"id":"J52","type":"judge","num":52,"stem":"截至2020年底，港口货物吞吐量和集装箱吞吐量都居世界第二位。","answer":false,"correction":"截至2020年底,港口货物吞吐量和集装箱吞吐量都居世界第一位。"},{"id":"J53","type":"judge","num":53,"stem":"2011年至2020年，水运货运量远超公路货运量。","answer":false,"correction":"2011年至2020年,公路货运量远超水运货运量。"},{"id":"J54","type":"judge","num":54,"stem":"2011年至2020年，水运客运量远超公路客运量。","answer":false,"correction":"2011年至2020年,公路客运量远超水运客运量。"},{"id":"J55","type":"judge","num":55,"stem":"我国的五大沿海港口群包括：环黄海港口群、长三角港口群、珠三角港口群、东南沿海港口群、西南沿海港口群。","answer":false,"correction":"我国的五大沿海港口群包括:环渤海港口群、长三角港口群、珠三角港口群、东南沿海港口群、西南沿海港口群。"},{"id":"J56","type":"judge","num":56,"stem":"水路支持系统建设步伐加快，包括安全监督、通信、救助打捞、水上消防、教育、科研和信息服务系统七个部分。","answer":true,"correction":""},{"id":"J57","type":"judge","num":57,"stem":"我国对水路交通运输系统投资较多，基础设施能力丰富。","answer":false,"correction":"我国对水路交通运输系统投资不足,基础设施能力短缺。"},{"id":"J58","type":"judge","num":58,"stem":"我国船队整体技术水平低，不适应航运市场发展需要：船队老化；平均吨位小。","answer":true,"correction":""},{"id":"J59","type":"judge","num":59,"stem":"水上交通运输法制健全，公平、有序的水运市场已建立。","answer":false,"correction":"水上交通运输法制不健全,公平、有序的水运市场尚未建立。"},{"id":"J60","type":"judge","num":60,"stem":"我国民用机场按所起作用分为枢纽、干线和次线机场。","answer":false,"correction":"我国民用机场按所起作用分为枢纽、干线和支线机场。"},{"id":"J61","type":"judge","num":61,"stem":"我国民用机场按所在城市地位、性质，分为一、二、三、四类。","answer":false,"correction":"我国民用机场按所在城市地位、性质,分为I、II、III、IV类。"},{"id":"J62","type":"judge","num":62,"stem":"我国民用机场按飞行区等级3C级等级最高。","answer":false,"correction":"我国民用机场按飞行区等级4F级等级最高。"},{"id":"J63","type":"judge","num":63,"stem":"我国航空运输系统服务水平较高。","answer":false,"correction":"我国航空运输系统服务水平较低。"},{"id":"J64","type":"judge","num":64,"stem":"我国航空运输系统要缩小运输规模，提高运输成本。","answer":false,"correction":"我国航空运输系统要扩大运输规模,降低运输成本。"},{"id":"J65","type":"judge","num":65,"stem":"我国的中南机场群由广东、广西、福建、河南、湖北、湖南6省（自治区）内各机场构成。","answer":false,"correction":"我国的中南机场群由广东、广西、海南、河南、湖北、湖南6省(自治区)内各机场构成。"},{"id":"J66","type":"judge","num":66,"stem":"我国西南机场群的机场总数达到39个。","answer":false,"correction":"我国西南机场群的机场总数达到52个。"},{"id":"J67","type":"judge","num":67,"stem":"目前，我国的管道运输主要是原油、成品油、天然气、煤浆。","answer":false,"correction":"目前，我国的管道运输主要是原油、成品油、天然气。","content_fix":"2026-11-17 内容复核订正：原改句『与题干一字不差（含煤浆）』→『删去「煤浆」的改句』；依据：煤浆管道在我国并无大规模商业运营，不宜列为主要管道运输对象，原改句未删。"},{"id":"J68","type":"judge","num":68,"stem":"我国的原油管道包括：鲁宁原油管道、魏荆原油管道、潜荆原油管道、甬沪宁原油管道、仪长线原油管道、兰成渝原油管道。","answer":false,"correction":"我国的原油管道包括：鲁宁原油管道、魏荆原油管道、潜荆原油管道、甬沪宁原油管道、仪长线原油管道。（兰成渝为成品油管道，不在此列）","content_fix":"2026-11-17 内容复核订正：原改句『将兰成渝保留在原油管道名单中、仅句末加括号注』→『把兰成渝从名单中删除的改句』；依据：兰成渝是成品油管道，原改句正文与括号注自相矛盾。"},{"id":"J69","type":"judge","num":69,"stem":"我国的天然气管道主要在陕甘宁地区。","answer":false,"correction":"我国的天然气管道主要在重庆和四川。"},{"id":"J70","type":"judge","num":70,"stem":"中俄石油管道全长约1000公里，全部管道都在中国境内。","answer":false,"correction":"中俄石油管道全长约1000公里,其中俄罗斯境内72公里,中国境内约930公里。"},{"id":"J71","type":"judge","num":71,"stem":"管道运输主要由管道和泵站等组成，建成后会受地形和气候限制。","answer":false,"correction":"管道运输主要由管道和泵站等组成,建成后不会受地形和气候限制。"},{"id":"J72","type":"judge","num":72,"stem":"管道运输的占地少，在陆地约95%的部分埋入地下，易对环境造成污染。","answer":false,"correction":"管道运输的占地少,在陆地约95%的部分埋入地下,不易对环境造成污染。"},{"id":"J73","type":"judge","num":73,"stem":"管道运输是双向持续进行，能耗小、运输量大，没有回程空驶的问题，成本较低。","answer":false,"correction":"管道运输是单向持续进行,能耗小、运输量大,没有回程空驶的问题,成本较低。"},{"id":"J74","type":"judge","num":74,"stem":"管道输送石油按吨公里能耗计算，在各种运输方式中是最高的。","answer":false,"correction":"管道输送石油按吨公里能耗计算,在各种运输方式中是最低的。"},{"id":"J75","type":"judge","num":75,"stem":"管道运输只适用于定点，定量，单向的运输，运输品种受到严格的限制，适应性很差。而且管道始建投资较大，金属消耗量也大。","answer":true,"correction":""},{"id":"J76","type":"judge","num":76,"stem":"我国的交通运输方式的发展历程与发达国家不一样。","answer":false,"correction":"我国的交通运输方式的发展历程与发达国家类似。"},{"id":"J77","type":"judge","num":77,"stem":"公路运输目前仍占主导，铁路有逐步取代公路成为主导的趋势。","answer":false,"correction":"铁路运输目前仍占主导,公路有逐步取代铁路成为主导的趋势。"},{"id":"J78","type":"judge","num":78,"stem":"管道、水运以货运为主，增长缓慢。航空客运增长速度最快。","answer":true,"correction":"","audit_note":"答案文件的原句与本题题面不一致，其改句与题面完全相同——本题题面本身正确，已按 √ 处理。"},{"id":"J79","type":"judge","num":79,"stem":"在特大、大城市及城市化地带，要充分发挥以道路交通为主的公用交通系统的作用。","answer":false,"correction":"在特大、大城市及城市化地带,要充分发挥以轨道交通为主的公用交通系统的作用。"},{"id":"J80","type":"judge","num":80,"stem":"根据十一五规划纲要确定的优先发展交通运输业的任务中，在继续发展公路、民航运输业的同时，加快铁路、水运的发展已成为当务之急。","answer":true,"correction":""},{"id":"J81","type":"judge","num":81,"stem":"市域内交通运输路网布局与结构不会因城市性质、规模等而变化。","answer":false,"correction":"市域内交通运输路网布局与结构会因城市性质、规模等而变化。"},{"id":"J82","type":"judge","num":82,"stem":"市域内交通运输中城市交通与城市发展和土地开发成负反馈关系。","answer":false,"correction":"市域内交通运输中城市交通与城市发展和土地开发成正反馈关系。"},{"id":"J83","type":"judge","num":83,"stem":"城市道路等级划分为：高速公路、一级公路、二级公路、三级公路、四级公路。","answer":false,"correction":"城市道路等级划分为:快速路、主干路、次干路、支路。 公路按照技术等级分为:高速公路、一级公路、二级公路、三级公路、四级公路。"},{"id":"J84","type":"judge","num":84,"stem":"在对外交通运输系统中，出入交通量与该城市在区域内和交通网络中的地位和作用有关。","answer":false,"correction":"在对外交通运输系统中,过境交通量与该城市在区域内和交通网络中的地位和作用有关。"},{"id":"J85","type":"judge","num":85,"stem":"在对外交通运输系统中，过境交通量与该城市的政治、经济和文化地位以及对外辐射强度有关。","answer":false,"correction":"在对外交通运输系统中,出入交通量与该城市的政治、经济和文化地位以及对外辐射强度有关。"},{"id":"J86","type":"judge","num":86,"stem":"轨道载运工具指的是沿固定轨道行驶，由汽油、柴油、电或其他能源作动力的车辆。","answer":false,"correction":"轨道载运工具指的是沿固定轨道行驶,由电力、内燃机或蒸汽作动力的车辆。"},{"id":"J87","type":"judge","num":87,"stem":"道路载运工具指的是利用电力、内燃机、蒸汽作动力，通过轮胎在各种道路上行驶的各种车辆。","answer":false,"correction":"道路载运工具指的是利用汽油、柴油、电或其他能源作动力,通过轮胎在各种道路上行驶的各种车辆。"},{"id":"J88","type":"judge","num":88,"stem":"水上载运工具指的是利用螺旋浆、喷射气流产生的推力而在水上行驶的载运工具。","answer":false,"correction":"水上载运工具指的是利用螺旋浆、喷射水流产生的推力而在水上行驶的载运工具。"},{"id":"J89","type":"judge","num":89,"stem":"空中载运工具指的是利用螺旋浆、喷射水流产生的推力而在空中航行的载运工具。","answer":false,"correction":"空中载运工具指的是利用螺旋浆、喷射气流产生的推力而在空中航行的载运工具。"},{"id":"J90","type":"judge","num":90,"stem":"载运工具的性能包括速度、效率、安全、可靠、环保、舒适、容量、费用。","answer":false,"correction":"载运工具的性能包括速度、安全、可靠、环保、舒适、容量、费用。","content_fix":"2026-11-17 内容复核订正：原改句『与题干一字不差（含效率）』→『删去「效率」的改句』；依据：载运工具性能六项为速度、容量、费用、安全可靠、环保、舒适（见 C95），「效率」不在其列，原改句未指出错点。"},{"id":"J91","type":"judge","num":91,"stem":"轨道载运工具应用类型包括：有轨电车、轻轨、地铁、市郊铁路、普通铁路、高速铁路、超级高铁。","answer":false,"correction":"轨道载运工具应用类型包括：有轨电车、轻轨、地铁、市郊铁路、普通铁路、高速铁路。","content_fix":"2026-11-17 内容复核订正：原改句『与题干一字不差（含超级高铁）』→『删去「超级高铁」的改句』；依据：超级高铁是未商业化的设想（J18、J99 亦确认未实现），不属已应用类型，原改句未删。"},{"id":"J92","type":"judge","num":92,"stem":"有轨电车是一种地面公共交通工具，依靠固定轨道和内燃机推动列车。","answer":false,"correction":"有轨电车是一种地面公共交通工具,依靠固定轨道和电力推动列车。"},{"id":"J93","type":"judge","num":93,"stem":"有轨电车按供电方式可以分为接触轨，架空接触网式、钢轮钢轨，胶轮导轨。","answer":false,"correction":"有轨电车按供电方式可以分为接触轨式、架空接触网式；按走行方式可以分为钢轮钢轨式、胶轮导轨式。","content_fix":"2026-11-17 内容复核订正：原改句『与题干一字不差』→『按供电/走行两种分类标准拆分的改句』；依据：「钢轮钢轨、胶轮导轨」是走行方式分类，被混入「按供电方式」的分类，原改句未改。"},{"id":"J94","type":"judge","num":94,"stem":"轻轨列车是单向输送能力为3-7万人/小时的轨道交通系统。","answer":false,"correction":"轻轨列车是单向输送能力为1-3万人/小时的轨道交通系统。 地铁列车是单向输送能力为3-7万人/小时的轨道交通系统。"},{"id":"J95","type":"judge","num":95,"stem":"市郊铁路在郊区采用立交道口行驶，在市区采用平交道口行驶，牵引方式多为内燃机牵引。","answer":false,"correction":"市郊铁路在郊区采用平交道口行驶,在市区采用立交道口行驶,牵引方式多为电力牵引。"},{"id":"J96","type":"judge","num":96,"stem":"国内首条市郊铁路是长株潭城际铁路。","answer":false,"correction":"国内首条市郊铁路是北京市郊铁路S2线。"},{"id":"J97","type":"judge","num":97,"stem":"市郊铁路在解决城市问题中的作用包括：促进卫星城镇比较优势的形成，促进城市副中心的形成。","answer":true,"correction":""},{"id":"J98","type":"judge","num":98,"stem":"高速磁浮铁路列车是利用磁铁异极相斥、同极相吸原理，使车体完全脱离轨道而悬浮在距离轨道约1厘米处，采用电力驱动的高速列车。","answer":false,"correction":"高速磁浮铁路列车是利用磁铁同极相斥、异极相吸原理,使车体完全脱离轨道而悬浮在距离轨道约1厘米处,采用磁力驱动的高速列车。"},{"id":"J99","type":"judge","num":99,"stem":"超级高铁是当前可实现的速度最快的地面交通工具。","answer":false,"correction":"高速磁浮铁路列车是当前可实现的速度最快的地面交通工具。"},{"id":"J100","type":"judge","num":100,"stem":"上海磁悬浮列车运营十年，现状悲惨的原因是高成本、低效益。","answer":true,"correction":""},{"id":"J101","type":"judge","num":101,"stem":"建于地上的是轻轨，建于地下的是地铁。","answer":false,"correction":"单向最大高峰小时客流量1~3万人次的称为轻轨,单向最大高峰小时客流量3~7万人次以上的称为地铁。"},{"id":"J102","type":"judge","num":102,"stem":"动车按动力来源分为蒸汽机车、内燃机车、电力机车、太阳能机车。","answer":false,"correction":"机车按动力来源分为蒸汽机车、内燃机车、电力机车。","content_fix":"2026-11-17 内容复核订正：原改句『与题干一字不差』→『机车按动力来源分为蒸汽机车、内燃机车、电力机车』；依据：按牵引动力分类的是机车而非动车，且并无「太阳能机车」这一通行类别，原改句一字未改。"},{"id":"J103","type":"judge","num":103,"stem":"拖车（挂车）：不配置动力的车辆，分为有驾驶室（城轨）和无驾驶室的拖车。","answer":true,"correction":""},{"id":"J104","type":"judge","num":104,"stem":"轨道载运工具实际作用在驱动轮上的功率为额定功率。","answer":false,"correction":"轨道载运工具实际作用在驱动轮上的功率为有效功率。"},{"id":"J105","type":"judge","num":105,"stem":"作用在驱动轮周上的切向力为牵引力，牵引力随车辆速度的增加而上升。","answer":false,"correction":"作用在驱动轮周上的切向力为牵引力,牵引力随车辆速度的增加而下降。"},{"id":"J106","type":"judge","num":106,"stem":"道路载运工具按照用途可以分为：轿车、客车、货车、牵引车、越野车、自卸车、专用车、挂车、汽车列车、电动汽车。","answer":false,"correction":"道路载运工具按照用途可以分为：轿车、客车、货车、牵引车、越野车、自卸车、专用车、挂车、汽车列车。","content_fix":"2026-11-17 内容复核订正：原改句『与题干一字不差（含电动汽车）』→『删去「电动汽车」的改句』；依据：电动汽车是按动力来源分的类别，混入了「按用途」的分类清单，原改句未删。"},{"id":"J107","type":"judge","num":107,"stem":"道路载运工具按照交通法规可以分为：公路用汽车、非公路用汽车。","answer":true,"correction":""},{"id":"J108","type":"judge","num":108,"stem":"质量-功率比越大，车辆的加速性能越大。","answer":false,"correction":"质量-功率比越大,车辆的加速性能越小。"},{"id":"J109","type":"judge","num":109,"stem":"BRT中的公交车和普通道路里面的公交没有什么差别。","answer":false,"correction":"BRT中的公交车和普通道路里面的公交有差别,配置更大容量、更高性能、低排放、舒适的公交车。"},{"id":"J110","type":"judge","num":110,"stem":"BRT的与轨道交通相比建设周期更长，建设与运营成本更高。","answer":false,"correction":"BRT的与轨道交通相比建设周期更短,建设与运营成本更低。"},{"id":"J111","type":"judge","num":111,"stem":"现代船舶以蒸汽机为主要动力装置。","answer":false,"correction":"现代船舶以柴油机为主要动力装置。"},{"id":"J112","type":"judge","num":112,"stem":"通常在船舶尾部设置锚、锚链装置以控制方向，在其首部两侧设舵装置以帮助船舶停泊。","answer":false,"correction":"通常在船舶尾部设置舵装置以控制方向,在其首部两侧设锚、锚链等装置以帮助船舶停泊。"},{"id":"J113","type":"judge","num":113,"stem":"第一艘集装箱船是英国于1956年用一艘货船改装而成的。","answer":false,"correction":"第一艘集装箱船是美国于1956年用一艘货船改装而成的。"},{"id":"J114","type":"judge","num":114,"stem":"2005年“中远宁波”号是当年世界上投入运营的最大的集装箱船舶。","answer":false,"correction":"2005年世界上投入运营的最大的集装箱船舶是“Colombo Express”号（8749 TEU）。","content_fix":"2026-11-17 内容复核订正：原改句『2005年“中远广州”号是当年世界上投入运营的最大的集装箱船舶』→『2005年最大集装箱船为 Colombo Express 号』；依据：中远广州（2006年2月交付）与中远宁波（2006年3月首航）在2005年均未投入运营，原改句年份与船名仍对不上。"},{"id":"J115","type":"judge","num":115,"stem":"2006年“中远广州”号是当时世界上在航的最大的集装箱船。","answer":false,"correction":"2006年“中远宁波”号是当时世界上在航的最大的集装箱船。"},{"id":"J116","type":"judge","num":116,"stem":"2018年“中远环球”是当时世界上在航的最大的集装箱船。","answer":false,"correction":"2018年当时世界上在航的最大的集装箱船是“东方香港”号（21413 TEU，2017年交付）；“宇宙号”（21237 TEU）是当时中国建造的最大集装箱船。","content_fix":"2026-11-17 内容复核订正：原改句『2018年“宇宙号”是当时世界上在航的最大的集装箱船』→『最大者为“东方香港”号』；依据：东方香港号21413 TEU大于宇宙号21237 TEU且2018年仍在航，原改句本身与史实不符。"},{"id":"J117","type":"judge","num":117,"stem":"杂货船可分为普通杂货船、高级杂货船、多用途杂货船。","answer":false,"correction":"杂货船可分为普通杂货船、多用途杂货船。","content_fix":"2026-11-17 内容复核订正：原改句『与题干逐字相同（含高级杂货船）』→『杂货船可分为普通杂货船、多用途杂货船』；依据：「高级杂货船」并非通行的杂货船分类名目，原改句与题干完全相同、未指出任何错点。"},{"id":"J118","type":"judge","num":118,"stem":"散货船型包括：“灵便型”散货船、“巴拿马型”散货船以及“好望角型”散货船。","answer":true,"correction":""},{"id":"J119","type":"judge","num":119,"stem":"大部分油轮是采用柴油机作为动力装置的。","answer":false,"correction":"大部分油轮是采用蒸汽机作为动力装置的。"},{"id":"J120","type":"judge","num":120,"stem":"油轮按载重船型可分为：超级油轮、苏伊士型油轮、阿芙拉型油轮、好望角型油轮、巴拿马型油轮、灵便型油轮、通用型油轮。","answer":false,"correction":"油轮按载重船型可分为：通用型油轮、灵便型油轮、巴拿马型油轮、阿芙拉型油轮、苏伊士型油轮、巨型油轮（VLCC）、超巨型油轮（ULCC）。","content_fix":"2026-11-17 内容复核订正：原改句『与题干一字不差（含好望角型、超级油轮）』→『按通行油轮分级重写的改句』；依据：好望角型是散货船船型、不是油轮分级，「超级油轮」应明确为 VLCC/ULCC，原改句未纠正。"},{"id":"J121","type":"judge","num":121,"stem":"苏伊士运河连接太平洋与大西洋，提供从欧洲至印度洋和西太平洋附近土地的最近的航线。","answer":false,"correction":"苏伊士运河连接地中海与红海,提供从欧洲至印度洋和西太平洋附近土地的最近的航线。"},{"id":"J122","type":"judge","num":122,"stem":"巴拿马运河位于中美洲国家巴拿马，连接地中海和红海，是重要的航运要道。","answer":false,"correction":"巴拿马运河位于中美洲国家巴拿马,连接太平洋和大西洋,是重要的航运要道。"},{"id":"J123","type":"judge","num":123,"stem":"载驳船用于河海联运。其作业过程是先将小驳船装上母船，再将货物装进规格相同的小驳船上。","answer":false,"correction":"载驳船用于河海联运。其作业过程是先将货物装进规格相同的小驳船上,再将这些小驳船装上母船。"},{"id":"J124","type":"judge","num":124,"stem":"驳船的载货量大、吃水浅、设备简单，全部不配置动力装置。","answer":false,"correction":"驳船的载货量大、吃水浅、设备简单,少数带有动力装置和推进装置。"},{"id":"J125","type":"judge","num":125,"stem":"现代的邮轮是指专门用来进行邮务运输的轮船。","answer":false,"correction":"现代的邮轮是指专门用于娱乐航海的客轮。"},{"id":"J126","type":"judge","num":126,"stem":"针对同一艘船的不同长度来说，有以下排序：总长 > 登记长度 >满载水线长 > 垂线间长。","answer":false,"correction":"针对同一艘船的不同长度来说,有以下排序:总长 > 满载水线长 > 登记长度 > 垂线间长。"},{"id":"J127","type":"judge","num":127,"stem":"船舶的登记长度指的是船体首尾两端间的最大水平距离。","answer":false,"correction":"船舶的登记长度指的是上甲板顶面从首柱前缘至尾柱后缘的水平距离。"},{"id":"J128","type":"judge","num":128,"stem":"船舶的满载水线长指的是首、尾垂线间的水平距离。","answer":false,"correction":"船舶的满载水线长指的是沿设计夏季载重水线自船首垂线至船尾端点的距离。"},{"id":"J129","type":"judge","num":129,"stem":"针对同一艘船的不同宽度来说，有以下排序：最大船宽 > 型宽> 登记宽度。","answer":false,"correction":"针对同一艘船的不同宽度来说,有以下排序:最大船宽 > 登记宽度 > 型宽。"},{"id":"J130","type":"judge","num":130,"stem":"船舶的登记宽度指的是包括一切固定结构物在内的船体最大宽度。","answer":false,"correction":"船舶的登记宽度指的是船体最宽处包括船壳板在内的宽度。"},{"id":"J131","type":"judge","num":131,"stem":"干舷的大小为型宽与吃水的差值。","answer":false,"correction":"干舷的大小为型深与吃水的差值。"},{"id":"J132","type":"judge","num":132,"stem":"船舶容积吨指的是丈量船舶容积后经换算而得出的吨位。","answer":true,"correction":""},{"id":"J133","type":"judge","num":133,"stem":"船舶容积吨的换算为：1吨位=100立方英尺= 1立方米。","answer":false,"correction":"船舶容积吨的换算为:1吨位=100立方英尺= 2.83立方米。"},{"id":"J134","type":"judge","num":134,"stem":"船舶容积吨中的总吨位指的是从总吨位中减除按吨位丈量规范规定为非营业性处所的容积后得出的容积。","answer":false,"correction":"船舶容积吨中的总吨位指的是对船舶按吨位丈量规范所规定的处所进行丈量后核定的内部总容积。"},{"id":"J135","type":"judge","num":135,"stem":"船舶实际排水量指的是船舶满载时，即吃水达到某一规定载重线时的排水量。","answer":false,"correction":"船舶实际排水量指的是只装一部分货物时的排水量。"},{"id":"J136","type":"judge","num":136,"stem":"船舶满载排水量包括燃料、淡水、货物及船舶常数的总重量。","answer":false,"correction":"船舶满载排水量包括空船排水量、燃料、淡水、货物及船舶常数的总重量。"},{"id":"J137","type":"judge","num":137,"stem":"船舶总载重吨指的是船舶所能装载最大限度的货物重量。","answer":false,"correction":"船舶总载重吨指的是船舶根据载重线标志规定,所能装载最大限度的重量。"},{"id":"J138","type":"judge","num":138,"stem":"船舶总载重吨＝满载排水量－空船排水量＝货物重量＋燃料＋淡水＋供应品＋常数。","answer":true,"correction":""},{"id":"J139","type":"judge","num":139,"stem":"船舶净载重吨＝总载重量－空船排水量-（燃料＋淡水＋常数及其他供应品）。","answer":false,"correction":"船舶净载重吨＝总载重吨－（燃料＋淡水＋常数及其他供应品）。","content_fix":"2026-11-17 内容复核订正：原改句『与题干一字不差（多减空船排水量）』→『船舶净载重吨＝总载重吨－（燃料＋淡水＋常数及其他供应品）』；依据：由 J138 公式，总载重吨已含空船排水量之差，再减一次属重复扣除，原改句未改。"},{"id":"J140","type":"judge","num":140,"stem":"我们常乘坐的旅客飞机指的是通用航空飞机。","answer":false,"correction":"我们常乘坐的旅客飞机指的是运输飞机。"},{"id":"J141","type":"judge","num":141,"stem":"美国农场主用来喷洒农药的飞机是运输飞机。","answer":false,"correction":"美国农场主用来喷洒农药的飞机是通用航空飞机。"},{"id":"J142","type":"judge","num":142,"stem":"通用航空飞机指的是由航空公司定期航班或非定期航班使用的各种飞机。","answer":false,"correction":"通用航空飞机指的是为工农业生产飞行、商业飞行,教学飞行等服务的各种飞机。"},{"id":"J143","type":"judge","num":143,"stem":"近程飞机、远程飞机都属于干线飞机。","answer":false,"correction":"中程飞机、远程飞机都属于干线飞机。"},{"id":"J144","type":"judge","num":144,"stem":"运输机的主要外形尺寸，决定机跑道和滑行道宽度、停机坪、机库、维修机坪面积等。","answer":true,"correction":""},{"id":"J145","type":"judge","num":145,"stem":"巡航速度指的是空中非匀速飞行时的速度。","answer":false,"correction":"巡航速度指的是空中匀速飞行时的速度。"},{"id":"J146","type":"judge","num":146,"stem":"航程指的是飞机在中途加油的情况下所能飞行的距离。","answer":false,"correction":"航程指的是飞机在中途不加油的情况下所能飞行的距离。"},{"id":"J147","type":"judge","num":147,"stem":"中国商飞研制的首款大型客机C919飞机中的“C”代表“中国”，“919”则代表我国首个大型客机的最大载客量为190座。","answer":false,"correction":"中国商飞研制的首款大型客机C919飞机中的“C”代表“中国”,第一个“9”寓意“天长地久”,“19”则代表我国首个大型客机的最大载客量为190座。"},{"id":"J148","type":"judge","num":148,"stem":"交通流仅仅用于道路运输。","answer":false,"correction":"交通流不仅用于道路运输、还用于铁路运输、航空运输、水路运输。"},{"id":"J149","type":"judge","num":149,"stem":"常用速度、交通量和交通密度三个指标来表征非稳态流的特性。","answer":false,"correction":"常用速度、交通量和交通密度三个指标来表征稳态流的特性。"},{"id":"J150","type":"judge","num":150,"stem":"稳态流又称间断流，非稳态流又称连续流。","answer":false,"correction":"稳态流又称连续流,非稳态流又称间断流。"},{"id":"J151","type":"judge","num":151,"stem":"稳态交通流的微观参数包括：交通量、密度、速度。","answer":false,"correction":"稳态交通流的微观参数包括:车头时距、车头间距。"},{"id":"J152","type":"judge","num":152,"stem":"平均运行速度指的是车辆行驶路程与有效行车时间（不包括停车时间,加、减速时间）之比。","answer":false,"correction":"平均运行速度指的是车辆通过某段路程与车辆通过该路程所需的总时间(包括中间停车时间和延误时间,但不包括住宿、修车、停车休息及离开行驶路线以外的时间)之比。"},{"id":"J153","type":"judge","num":153,"stem":"技术速度指的是在道路交通与气候条件良好的情况下，仅受道路物理条件限制时所能保持的最大安全车速。","answer":false,"correction":"技术速度指的是行驶时间如包括启动和制动时的加速和减速时间,则该段行程与行驶时间之比称为技术速度。"},{"id":"J154","type":"judge","num":154,"stem":"时间平均车速指的是在某一瞬间道路上某一区段内所有车辆速度分布的平均值。","answer":false,"correction":"时间平均车速指的是单位时间通过道路某断面的各车辆地点车速的算术平均值。"},{"id":"J155","type":"judge","num":155,"stem":"通常情况下，时间平均速度略小于空间平均速度。","answer":false,"correction":"通常情况下,时间平均速度略大于空间平均速度。"},{"id":"J156","type":"judge","num":156,"stem":"速度-频率分布曲线中的频率最低值为最常见车速。","answer":false,"correction":"速度-频率分布曲线中的频率最高值为最常见车速。"},{"id":"J157","type":"judge","num":157,"stem":"通常将速度-频率累积曲线中的85%位车速作为道路的最低限速值。","answer":false,"correction":"通常将速度-频率累积曲线中的85%位车速作为道路的最高限速值。"},{"id":"J158","type":"judge","num":158,"stem":"15%位车速指在某地点车速下行驶的车辆数与在该速度以上行驶的车辆数相等。","answer":false,"correction":"中位车速指在某地点车速下行驶的车辆数与在该速度以上行驶的车辆数相等。"},{"id":"J159","type":"judge","num":159,"stem":"假设交通流中不同车辆的速度服从正态分布，那么这个正态分布的对称轴速度的是85%位车速。","answer":false,"correction":"假设交通流中不同车辆的速度服从正态分布,那么这个正态分布的对称轴速度的是时间平均车速。"},{"id":"J160","type":"judge","num":160,"stem":"交通量指的是某一瞬间，单位长度车道上的车辆数。","answer":false,"correction":"交通量指的是单位时段内通过线路或通道上某断面上的交通实体的数量。"},{"id":"J161","type":"judge","num":161,"stem":"车头间距指的是同一地点相继车辆经过的时间间隔。","answer":false,"correction":"车头时距指的是同一地点相继车辆经过的时间间隔。"},{"id":"J162","type":"judge","num":162,"stem":"通常将年最大小时交通量作为设计小时交通量。","answer":false,"correction":"通常将年第30位小时交通量作为设计小时交通量。"},{"id":"J163","type":"judge","num":163,"stem":"一个交通设施有足够的容量去满足高峰小时的需求，那么这个交通设施内就不会发生阻塞。","answer":false,"correction":"一个交通设施有足够的容量去满足高峰小时的需求,但在高峰小时内,短期的流量高峰可能超过容量,从而引起阻塞。"},{"id":"J164","type":"judge","num":164,"stem":"月变系数指的是月平均日交通量与年平均日交通量的比值。","answer":false,"correction":"月变系数指的是年平均日交通量与月平均日交通量的比值。"},{"id":"J165","type":"judge","num":165,"stem":"周变图指的是以一周的7天为横坐标，一周内各日的平均日交通量相当于年平均日交通量的百分数为纵坐标，绘成的折线图。","answer":false,"correction":"周变图指的是以一周的7天为横坐标,年平均日交通量相当于一周内各日的平均日交通量的百分数为纵坐标,绘成的折线图。"},{"id":"J166","type":"judge","num":166,"stem":"时变系数为各小时交通量与全天交通量的比值。","answer":true,"correction":""},{"id":"J167","type":"judge","num":167,"stem":"高峰小时系数为高峰小时的时变系数。指的是(早/晚)高峰小时交通量与该天全天交通量之比。","answer":false,"correction":"高峰小时流量比为高峰小时的时变系数。指的是(早/晚)高峰小时交通量与该天全天交通量之比。"},{"id":"J168","type":"judge","num":168,"stem":"高峰小时流量比就是高峰小时交通量与高峰小时内某一时段的交通量扩大为1小时的小时交通量的比值。","answer":false,"correction":"高峰小时系数就是高峰小时交通量与高峰小时内某一时段的交通量扩大为1小时的小时交通量的比值。"},{"id":"J169","type":"judge","num":169,"stem":"一般来说，PHF值在0.70 到O.98 之间，较高的PHF值意味着流量变化较大。","answer":false,"correction":"一般来说,PHF值在0.70 到O.98 之间,较低的PHF值意味着流量变化较大。"},{"id":"J170","type":"judge","num":170,"stem":"城乡间交通量的差别显著，一般说来，农村公路的交通量大于城市道路的交通量。","answer":false,"correction":"城乡间交通量的差别显著,一般说来,城市道路的交通量大于农村公路的交通量。"},{"id":"J171","type":"judge","num":171,"stem":"交通密度也称交通集度，是某瞬间单位线路长度上的车辆数，其概念公式为：k=n/T。","answer":false,"correction":"交通密度也称交通集度,是某瞬间单位线路长度上的车辆数,其概念公式为:。"},{"id":"J172","type":"judge","num":172,"stem":"当交通量由零逐渐增大，接近或达到道路通行能力时的交通密度称为临界密度，临界密度反映交通流最大时的密度，故又称为最佳密度；常用kj来表示。","answer":false,"correction":"当交通量由零逐渐增大,接近或达到道路通行能力时的交通密度称为临界密度,临界密度反映交通流最大时的密度,故又称为最佳密度;常用km来表示。"},{"id":"J173","type":"judge","num":173,"stem":"交通密度与平均车头时距互为倒数，交通量与平均车头间距互为倒数。","answer":false,"correction":"交通密度与平均车头间距互为倒数,交通量与平均车头时距互为倒数。"},{"id":"J174","type":"judge","num":174,"stem":"空间占有率越高，交通密度越大，时间占有率越高，交通密度越小。","answer":false,"correction":"空间占有率越高,交通密度越大,时间占有率越高,交通密度越大。"},{"id":"J175","type":"judge","num":175,"stem":"空间占有率指的是在道路的任意路段上，车辆通过时间的累计值与观测总时间之比。","answer":false,"correction":"空间占有率指的是在一定路段上,车辆总长度与路段总长度之比。"},{"id":"J176","type":"judge","num":176,"stem":"在格林希尔茨公式中，v=vm(1-Kkm)。","answer":false,"correction":"在格林希尔茨公式中,。"},{"id":"J177","type":"judge","num":177,"stem":"在平均速度-交通密度关系中，k=kj时，平均速度为自由流速度，k=0时，速度为0，发生交通堵塞。","answer":false,"correction":"在平均速度-交通密度关系中,k=0时,平均速度为自由流速度,k=kj时,速度为0,发生交通堵塞。"},{"id":"J178","type":"judge","num":178,"stem":"交通量和平均速度关系中，从V=0至Vf值，其交通流状态越来越拥挤。","answer":false,"correction":"交通量和平均速度关系中,从V=0至Vf值,其交通流状态越来越自由。"},{"id":"J179","type":"judge","num":179,"stem":"道路的通行能力指在一定的道路条件、交通条件、控制条件和环境条件下，道路断面一定时间内能够通过的实际车辆数。","answer":false,"correction":"道路的通行能力指在一定的道路条件、交通条件、控制条件和环境条件下,道路断面一定时间内能够通过的最大车辆数。"},{"id":"J180","type":"judge","num":180,"stem":"道路通行能力中的环境条件指的是大风、大雨等天气。","answer":false,"correction":"道路通行能力中的环境条件指的是横向干扰程度及交通秩序。"},{"id":"J181","type":"judge","num":181,"stem":"通行能力反映交通流的实际车辆数，数值具有动态性与随机性。","answer":false,"correction":"通行能力反映交通流的最大车辆数,数值具有相对稳定性。"},{"id":"J182","type":"judge","num":182,"stem":"通常将通行能力与交通量的比值称为交通负荷或饱和度。","answer":false,"correction":"通常将交通量与通行能力的比值称为交通负荷或饱和度。"},{"id":"J183","type":"judge","num":183,"stem":"在正常运行状况下，道路交通量均大于通行能力。","answer":false,"correction":"在正常运行状况下,道路交通量均小于通行能力。"},{"id":"J184","type":"judge","num":184,"stem":"只有当道路上的交通量大于通行能力时，才会出现交通拥挤或阻塞停滞现象。","answer":false,"correction":"当道路上的交通量接近或等于通行能力时,就会出现交通拥挤或阻塞停滞现象。"},{"id":"J185","type":"judge","num":185,"stem":"在同等条件下，可能通行能力 > 基本通行能力 > 设计通行能力。","answer":false,"correction":"在同等条件下,基本通行能力 > 可能通行能力 > 设计通行能力。"},{"id":"J186","type":"judge","num":186,"stem":"可能通行能力指的是在实际的道路、交通、控制及环境条件下，一条车道的一横断面上，在指定的设计服务水平下，1h所能通过的最大标准车辆数。","answer":false,"correction":"可能通行能力指的是在实际的道路、交通、控制及环境条件下,一条车道的一横断面上,不论服务水平如何,1h所能通过的最大标准车辆数。"},{"id":"J187","type":"judge","num":187,"stem":"影响通行能力的因素包括：道路状况、车辆性能、交通条件、交通管理、人员素质、环境干扰、气候条件。","answer":true,"correction":""},{"id":"J188","type":"judge","num":188,"stem":"排队论以流体力学为基础，研究随机服务系统的理论，亦称随机服务系统理论，是研究排队现象的一门科学。","answer":false,"correction":"排队论以概率论为基础,研究随机服务系统的理论,亦称随机服务系统理论,是研究排队现象的一门科学。"},{"id":"J189","type":"judge","num":189,"stem":"排队论是20世纪初丹麦科学家爱尔兰在研究交通的拥挤问题时提出的理论。","answer":false,"correction":"排队论是20世纪初丹麦科学家爱尔兰在研究电话通话的拥挤问题时提出的理论。"},{"id":"J190","type":"judge","num":190,"stem":"排队论中，确保单通道排队系统稳定的条件是：ρ>1。","answer":false,"correction":"排队论中,确保单通道排队系统稳定的条件是:。"},{"id":"J191","type":"judge","num":191,"stem":"在排队论中，描述到达分布和服务时间分布的分布形式只有泊松分布和负指数分布两种。","answer":false,"correction":"在排队论中,描述到达分布和服务时间分布的分布形式包括泊松分布、负指数分布、爱尔兰分布、二项分布、正态分布等。"},{"id":"J192","type":"judge","num":192,"stem":"排队系统的组成部分包括输入过程、排队车辆、排队规则、服务机构。","answer":false,"correction":"排队系统的组成部分包括输入过程、排队规则、服务机构。","content_fix":"2026-11-17 内容复核订正：原改句『与题干逐字相同（含排队车辆）』→『删去「排队车辆」的改句』；依据：排队系统标准三要素为输入过程、排队规则、服务机构，「排队车辆」是排队对象而非组成部分。"},{"id":"J193","type":"judge","num":193,"stem":"泊松分布的均值和方差在数值上都一样，均是λt。","answer":true,"correction":""},{"id":"J194","type":"judge","num":194,"stem":"负指数分布的均值和方差在数值上都一样，均是1/λ。","answer":false,"correction":"负指数分布的均值和方差在数值不一样,均值是,方差是。"},{"id":"J195","type":"judge","num":195,"stem":"对于服务机构来说，若其服从负指数分布，且其服务率为μ，则每一顾客的服务时间>t的概率为1-e-μt。","answer":false,"correction":"对于服务机构来说,若其服从负指数分布,且其服务率为,则每一顾客的服务时间>t的概率为。"},{"id":"J196","type":"judge","num":196,"stem":"D/M/C表示顾客按泊松分布到达、服务时间为负指数分布和C个服务台的模型。","answer":false,"correction":"D/M/C表示顾客按确定的间隔时间到达、服务时间为负指数分布和C个服务台的模型。"},{"id":"J197","type":"judge","num":197,"stem":"排队长指的是系统中平均顾客数，包括排队的顾客和正在接受服务的顾客。","answer":false,"correction":"排队长指的是系统中排队等待服务的平均顾客数。"},{"id":"J198","type":"judge","num":198,"stem":"逗留时间指的是顾客排队等待的平均时间。","answer":false,"correction":"逗留时间指的是顾客的平均逗留时间,包括排队时间和接受服务时间。"},{"id":"J199","type":"judge","num":199,"stem":"忙期指的是从顾客到达空闲服务结构起到服务结构再次空闲的概率。","answer":false,"correction":"忙期指的是从顾客到达空闲服务机构起、到服务机构再次空闲为止的一段时间。","content_fix":"2026-11-17 内容复核订正：原答案『√』→『×』；依据：忙期是时间长度概念，题面说成「的概率」量纲与概念全错，且「服务结构」应为「服务机构」，原判√有误。"},{"id":"J200","type":"judge","num":200,"stem":"排队论的时间-累计车辆数的图中，若到达曲线与离去曲线重合说明产生了排队现象，若二者不重合说明没有排队。","answer":false,"correction":"排队论的时间-累计车辆数的图中,若到达曲线与离去曲线重合说明没有排队,若二者不重合说明产生了排队现象。"},{"id":"J201","type":"judge","num":201,"stem":"排队论的时间-累计车辆数的图中，对横坐标积分的出来的面积数值指的是总的等待时间。","answer":true,"correction":"","content_fix":"2026-11-17 内容复核订正：原答案『×（改句作「总的排队车辆数」）』→『√』；依据：题面原本正确——累计车辆数图中两曲线间面积量纲为辆·时，即总等待时间，原改句把对的改错了。"},{"id":"J202","type":"judge","num":202,"stem":"平均排队长度、平均到达率与平均排队时间的关系为：平均排队时间＝平均到达率×平均排队长度。","answer":false,"correction":"平均排队长度、平均到达率与平均排队时间的关系为:平均排队长度=平均到达率×平均排队时间。"},{"id":"J203","type":"judge","num":203,"stem":"稳态流区的特点是交通量很小，按驾驶员希望的速度行驶。","answer":false,"correction":"稳态流区的特点是交通量开始增大,选择行驶速度的自由度逐渐减小。"},{"id":"J204","type":"judge","num":204,"stem":"驾驶者选择车辆运行速度的自由度受到很大限制，行驶车辆受别的车辆或行人的干扰很大，交通流处于稳定流的下半部分，并已接近不稳定流范围——说的是中国服务水平分级中的二级。","answer":false,"correction":"驾驶者选择车辆运行速度的自由度受到很大限制,行驶车辆受别的车辆或行人的干扰很大,交通流处于稳定流的下半部分,并已接近不稳定流范围——说的是中国服务水平分级中的三级。"},{"id":"J205","type":"judge","num":205,"stem":"交通运输工程规划的目标是满足交通需求、引导经济社会发展。","answer":true,"correction":""},{"id":"J206","type":"judge","num":206,"stem":"交通运输工程规划按服务对象分为客运交通规划、货运交通规划；按移动对象分公共交通规划、特定用户交通规划。","answer":false,"correction":"交通运输工程规划按移动对象分为客运交通规划、货运交通规划;按服务对象分公共交通规划、特定用户交通规划。"},{"id":"J207","type":"judge","num":207,"stem":"综合交通枢纽指的是公交线路的换乘。","answer":false,"correction":"综合交通枢纽指的是城市交通运输系统内的不同运输方式之间的换乘。"},{"id":"J208","type":"judge","num":208,"stem":"交通运输工程规划的中长期规划年限为20-30年。","answer":false,"correction":"交通运输工程规划的中长期规划年限为10-20年。"},{"id":"J209","type":"judge","num":209,"stem":"交通规划的步骤分别是：现状数据的调查与采集、现状诊断分析及目标政策确定、供给分析、需求分析和预测、方案制定分析和评价、编制文件和报告。","answer":true,"correction":""},{"id":"J210","type":"judge","num":210,"stem":"交通规划现状数据的调查和采集中的经济和社会方面的数据包括：交通设施调查、载运工具调查、交通流量流向的数据。","answer":false,"correction":"交通规划现状数据的调查和采集中的交通运输方面的数据包括:交通设施调查、载运工具调查、交通流量流向的数据。"},{"id":"J211","type":"judge","num":211,"stem":"需求是指交通运输系统物理实体（包括基础设施和运输工具）能提供的交通运输服务。","answer":false,"correction":"供给是指交通运输系统物理实体(包括基础设施和运输工具)能提供的交通运输服务。"},{"id":"J212","type":"judge","num":212,"stem":"交通规划的方案制定、分析和评价过程中针对存在的不足和所设定的目标，提出1个改善方案。","answer":false,"correction":"交通规划的方案制定、分析和评价过程中针对存在的不足和所设定的目标,提出3-5个改善方案供分析比较后选择。"},{"id":"J213","type":"judge","num":213,"stem":"交通评价尽可能采用定量的指标，无法量化的采用评分方法。","answer":true,"correction":""},{"id":"J214","type":"judge","num":214,"stem":"需求函数中若运量不发生变化，需求量减少，则其运价会上升。","answer":false,"correction":"需求函数中若运量不发生变化,需求量减少,则其运价会下降。"},{"id":"J215","type":"judge","num":215,"stem":"需求函数中若运价不发生变化，需求量增加，则其运量会减少。","answer":false,"correction":"需求函数中若运价不发生变化,需求量增加,则其运量会增加。"},{"id":"J216","type":"judge","num":216,"stem":"需求-供给两曲线的交点供求平衡点是固定不变的。","answer":false,"correction":"需求-供给两曲线的交点供求平衡点是在一个恒定值内动态变化的。"},{"id":"J217","type":"judge","num":217,"stem":"若|e|=1，称为非弹性需求，影响变量的变化对需求量的影响不大。","answer":false,"correction":"若|e|<1,称为非弹性需求,影响变量的变化对需求量的影响不大。"},{"id":"J218","type":"judge","num":218,"stem":"交通规划中的趋势外推法中的最主要的方法是特尔斐法。","answer":false,"correction":"交通规划中的趋势外推法中的最主要的方法是回归分析法。","audit_note":"答案文件把改句误标为原句，已按内容识别为改句。"},{"id":"J219","type":"judge","num":219,"stem":"交通规划中的趋势外推法的参考依据包括弹性系数、产运系数、人均出行（乘车）次数、按生产量同消费量余额或缺额平衡。","answer":false,"correction":"交通规划中的经验判断法的参考依据包括弹性系数、产运系数、人均出行(乘车)次数、按生产量同消费量余额或缺额平衡。"},{"id":"J220","type":"judge","num":220,"stem":"交通规划四阶段模型中的交通生成预测中方法包括：增长系数法、重力模型法。","answer":false,"correction":"交通规划四阶段模型中的交通分布预测中方法包括:增长系数法、重力模型法。"},{"id":"J221","type":"judge","num":221,"stem":"交通规划四阶段模型中的交通方式划分预测中方法包括：平衡分配、非平衡分配、随机分配。","answer":false,"correction":"交通规划四阶段模型中的交通分配预测中方法包括:平衡分配、非平衡分配、随机分配。","audit_note":"答案文件题号后漏了顿号，答案完整。"},{"id":"J222","type":"judge","num":222,"stem":"经济评价对各方案进行费用-效益分析，并考虑货币的时间价值，分别折换成现值后，采用不同的指标和方法确定各个方案在经济上的有利程度。","answer":true,"correction":""},{"id":"J223","type":"judge","num":223,"stem":"国民经济评价是从财务角度分析和计算项目的财务盈利能力和清偿能力，据以判别项目方案的财务可行性。","answer":false,"correction":"财务评价是从财务角度分析和计算项目的财务盈利能力和清偿能力,据以判别项目方案的财务可行性。"},{"id":"J224","type":"judge","num":224,"stem":"直接费用是指由于运输设施扩建产生的诸如空气污染、噪声增加、能源消耗等。","answer":false,"correction":"间接费用是指由于运输设施扩建产生的诸如空气污染、噪声增加、能源消耗等。"},{"id":"J225","type":"judge","num":225,"stem":"交通运输工程项目经济评价以财务评价为主，而对其中有营业性收入的项目还要作国民经济评价。","answer":false,"correction":"交通运输工程项目经济评价以国民经济评价为主,而对其中有营业性收入的项目还要作财务评价。"},{"id":"J226","type":"judge","num":226,"stem":"交通运输项目的间接效益包括：运输费用降低、行程时间节约、运距缩短、事故率降低、货物周转加快等。","answer":false,"correction":"交通运输项目的直接效益包括:运输费用降低、行程时间节约、运距缩短、事故率降低、货物周转加快等。"},{"id":"J227","type":"judge","num":227,"stem":"我国一般建设项目均采用国家折现率。一般情况下由政府根据测算和政策研究公布。","answer":false,"correction":"我国一般建设项目均采用社会折现率。一般情况下由政府根据测算和政策研究公布。"},{"id":"J228","type":"judge","num":228,"stem":"资金的机会成本，又称为资金的影子价格，单位资金的影子价格就叫影子利率。","answer":true,"correction":""},{"id":"J229","type":"judge","num":229,"stem":"国民收入的增长取决于资源的利用效率，因此，影子价格又称为速率影子价格。","answer":false,"correction":"国民收入的增长取决于资源的利用效率,因此,影子价格又称为效率影子价格。"},{"id":"J230","type":"judge","num":230,"stem":"内部收益率就是项目的效益的现值总额减去项目费用的现值总额的差额，或项目在评价期内各年的净效益折现到基年的现值之和。","answer":false,"correction":"净现值就是项目的效益的现值总额减去项目费用的现值总额的差额,或项目在评价期内各年的净效益折现到基年的现值之和。"},{"id":"J231","type":"judge","num":231,"stem":"净现值即项目在计算年限内，使各年净现值的累计值等于零时的折现率。","answer":false,"correction":"内部收益率即项目在计算年限内,使各年净现值的累计值等于零时的折现率。"},{"id":"J232","type":"judge","num":232,"stem":"净现值能直观地反映投资者可得到的利益，易于被人接受。","answer":false,"correction":"内部收益率能直观地反映投资者可得到的利益,易于被人接受。"},{"id":"J233","type":"judge","num":233,"stem":"内部收益率是反映规划项目对国民经济所做贡献的指标。","answer":false,"correction":"净现值是反映规划项目对国民经济所做贡献的指标。"},{"id":"J234","type":"judge","num":234,"stem":"汽车轮胎在水泥混凝土路面上的滚动阻力约是钢轮同钢轨之间的滚动阻力的1/10，因而轨道载运工具单位重量的能源消耗最低。","answer":false,"correction":"钢轮同钢轨之间的滚动阻力约是汽车轮胎在水泥混凝土路面上的滚动阻力的1/10,因而轨道载运工具单位重量的能源消耗最低。"},{"id":"J235","type":"judge","num":235,"stem":"轨道交通的优点包括：维护工作少，耐久性高，行驶平稳舒适，可适应不利的气候条件，对环境的污染大。","answer":false,"correction":"轨道交通的优点包括:维护工作少,耐久性高,行驶平稳舒适,可适应不利的气候条件,对环境的污染小。"},{"id":"J236","type":"judge","num":236,"stem":"轨道工程的附属工程包括路基、涵洞或桥梁、隧道、信号、电力供应和给水排水等交通控制、运营管理和供应的设施。","answer":false,"correction":"轨道工程包括路基、涵洞或桥梁、隧道、信号、电力供应和给水排水等交通控制、运营管理和供应的设施。","content_fix":"2026-11-17 内容复核订正：原改句『与题干逐字相同』→『删去「附属」的改句』；依据：路基、涵洞或桥梁、隧道属轨道工程的主体工程而非附属工程，错点在「附属工程」的定性，原改句一字未改。"},{"id":"J237","type":"judge","num":237,"stem":"高速轨道交通指的是满足长距离、中速度的轨道交通干线。","answer":false,"correction":"高速轨道交通指的是满足长距离、高速度的轨道交通干线。"},{"id":"J238","type":"judge","num":238,"stem":"系统类型、线路等级、设计运量可以决定设计行车速度，而设计行车速度则不会影响线路几何特征的设计和车站的分布。","answer":false,"correction":"系统类型、线路等级、设计运量可以决定设计行车速度,而设计行车速度则会影响线路几何特征的设计和车站的分布。"},{"id":"J239","type":"judge","num":239,"stem":"普通铁路等级分为一级、二级、三级、四级。","answer":false,"correction":"普通铁路等级分为I级、II级、III级、IV级。","audit_note":"答案文件未印 √/×，但附有改句，已判定为 ×。"},{"id":"J240","type":"judge","num":240,"stem":"设计运量指线路设计年度的实际客货运量。","answer":false,"correction":"设计运量指线路设计年度的预测客货运量。"},{"id":"J241","type":"judge","num":241,"stem":"普通铁路及高速轨道交通的设计运量采用远期年客货运量表示。","answer":false,"correction":"普通铁路及高速轨道交通的设计运量采用近期年客货运量表示。"},{"id":"J242","type":"judge","num":242,"stem":"对于客货运量小的线路只考虑修建双线，对客货运量增长快的线路需建设单线或预留单线。","answer":false,"correction":"对于客货运量小的线路只考虑修建单线,对客货运量增长快的线路需建设双线或预留双线。"},{"id":"J243","type":"judge","num":243,"stem":"复线率指的是铁路营业里程占铁路复线里程的比重。","answer":false,"correction":"复线率指的是铁路复线里程占铁路营业里程的比重。"},{"id":"J244","type":"judge","num":244,"stem":"线路平面指的是路线中心线在铅垂面上的投影。","answer":false,"correction":"线路平面指的是路线中心线在水平面上的投影。"},{"id":"J245","type":"judge","num":245,"stem":"车辆受到的离心力大小同速度的平方成反比，同曲线半径成正比。","answer":false,"correction":"车辆受到的离心力大小同速度的平方成正比,同曲线半径成反比。"},{"id":"J246","type":"judge","num":246,"stem":"列车的曲线半径越大，限速值越低。","answer":false,"correction":"列车的曲线半径越小,限速值越低。"},{"id":"J247","type":"judge","num":247,"stem":"地形较为平坦或地物限制（控制点）较少，应尽可能采用小的曲线半径；地形困难地段，可选用较大的曲线半径。","answer":false,"correction":"地形较为平坦或地物限制(控制点)较少,应尽可能采用大的曲线半径;地形困难地段,可选用较小的曲线半径。"},{"id":"J248","type":"judge","num":248,"stem":"缓和曲线常用的线型是五次抛物线。","answer":false,"correction":"缓和曲线常用的线型是三次抛物线。"},{"id":"J249","type":"judge","num":249,"stem":"线路纵断面指的是路线中心线在铅垂面上的投影。","answer":true,"correction":""},{"id":"J250","type":"judge","num":250,"stem":"轨道工程设计纵断面时若要求的运输能力较大则选用大功率的机车和较大的限制坡度。若要求运输能力一定则选用大功率机车和采用较小的限制坡度。","answer":false,"correction":"轨道工程设计纵断面时若要求的运输能力较大则选用大功率的机车和较小的限制坡度。若要求运输能力一定则选用大功率机车和采用较大的限制坡度。"},{"id":"J251","type":"judge","num":251,"stem":"轨道工程在设计纵断面时，线路坡度在满足排水及标高控制要求的前提下应尽可能陡峭。","answer":false,"correction":"轨道工程在设计纵断面时,线路坡度在满足排水及标高控制要求的前提下应尽可能平缓。"},{"id":"J252","type":"judge","num":252,"stem":"地铁规范规定，两条竖曲线之间的夹直线不宜小于50m。这个规定设置的原因是：为了避免或减轻列车同时位于两条竖曲线而产生的振动叠加。","answer":true,"correction":""},{"id":"J253","type":"judge","num":253,"stem":"轨道工程中，在两钢轨连接处应预留适当的缝隙，以便湿度变化时可以自由伸缩。","answer":false,"correction":"轨道工程中,在两钢轨连接处应预留适当的缝隙,以便温度变化时可以自由伸缩。"},{"id":"J254","type":"judge","num":254,"stem":"在我国两条钢轨间的标准轨距为1345mm。","answer":false,"correction":"在我国两条钢轨间的标准轨距为1435mm。"},{"id":"J255","type":"judge","num":255,"stem":"将1435毫米这个数字作为世界铁路标准轨距的原因之一是为了纪念世界“高铁之父”斯蒂芬森。","answer":false,"correction":"将1435毫米这个数字作为世界铁路标准轨距的原因之一是为了纪念世界“铁路之父”斯蒂芬森。"},{"id":"J256","type":"judge","num":256,"stem":"中间站的车站分布需要考虑机车类型的要求。","answer":false,"correction":"中间站的车站分布需要考虑通过能力的要求。"},{"id":"J257","type":"judge","num":257,"stem":"编组站和区段站都是铁路运输的技术作业站，作业的种类完全不同。","answer":false,"correction":"编组站和区段站都是铁路运输的技术作业站,作业的种类基本相同。"},{"id":"J258","type":"judge","num":258,"stem":"区段站的作业包括办理大量改编车流，解体和编组各种直达、直通、区段、沿零摘挂以及小运转列车。","answer":false,"correction":"编组站的作业包括办理大量改编车流,解体和编组各种直达、直通、区段、沿零摘挂以及小运转列车。"},{"id":"J259","type":"judge","num":259,"stem":"道路运输具有运输成本低、环境污染小等缺点。","answer":false,"correction":"道路运输具有运输成本高、环境污染大等缺点。"},{"id":"J260","type":"judge","num":260,"stem":"道路指的是供各种有轨车辆和行人等通行的工程设施。","answer":false,"correction":"道路指的是供各种无轨车辆和行人等通行的工程设施。"},{"id":"J261","type":"judge","num":261,"stem":"一级公路是具有特别重要的政治、经济意义，专供汽车分向、分车道行驶并全部控制出入的干线公路。","answer":false,"correction":"高速公路是具有特别重要的政治、经济意义,专供汽车分向、分车道行驶并全部控制出入的干线公路。"},{"id":"J262","type":"judge","num":262,"stem":"三级公路是沟通县、乡（镇）、村等的公路。","answer":false,"correction":"四级公路是沟通县、乡(镇)、村等的公路。"},{"id":"J263","type":"judge","num":263,"stem":"乡道是指具有全县（旗、县级市）政治、经济意义，联结县城和县内主要乡（镇）、主要生产与集散地的公路，以及不属于国道、省道的县际间的公路。","answer":false,"correction":"县道是指具有全县(旗、县级市)政治、经济意义,联结县城和县内主要乡(镇)、主要生产与集散地的公路,以及不属于国道、省道的县际间的公路。"},{"id":"J264","type":"judge","num":264,"stem":"高速公路的远景设计年限是15年。","answer":false,"correction":"高速公路的远景设计年限是20年。"},{"id":"J265","type":"judge","num":265,"stem":"一级公路的远景设计年限是15年。","answer":false,"correction":"一级公路的远景设计年限作为干线公路时20年、集散公路时15年。"},{"id":"J266","type":"judge","num":266,"stem":"高速公路的设计路段长度是5公里。","answer":false,"correction":"高速公路的设计路段长度是大于或等于20公里,特殊10公里。"},{"id":"J267","type":"judge","num":267,"stem":"公里和城市道路的施工机械包括压路机、摊铺机。","answer":true,"correction":""},{"id":"J268","type":"judge","num":268,"stem":"城市道路位于城际之间，为长距离客货运输服务，服务对象主要是机动车，兼有少量的非机动车和行人。","answer":false,"correction":"公路位于城际之间,为长距离客货运输服务,服务对象主要是机动车,兼有少量的非机动车和行人。"},{"id":"J269","type":"judge","num":269,"stem":"公路为公共设施，其它配套市政公用设施有给排水、电力、通、照明、燃气、热力等。","answer":false,"correction":"城市道路为公共设施,其它配套市政公用设施有给排水、电力、通、照明、燃气、热力等。"},{"id":"J270","type":"judge","num":270,"stem":"城市道路利用纵横坡向边沟排水，汇集后排向河流。","answer":false,"correction":"公路利用纵横坡向边沟排水,汇集后排向河流。"},{"id":"J271","type":"judge","num":271,"stem":"城市道路因为边沟排水，一般不会受到浸泡，而公路往往因为地下排水管道不通造成路面被水浸泡而过早损坏。","answer":false,"correction":"公路因为边沟排水,一般不会受到浸泡,而城市道路往往因为地下排水管道不通造成路面被水浸泡而过早损坏。"},{"id":"J272","type":"judge","num":272,"stem":"车辆反复碾压道路是道路损坏最主要的原因。","answer":false,"correction":"水损是道路损坏最主要的原因。"}, :286,"stem":"沥青路面缺点是使用年限较水泥路面短，易受天气影响，有利于夜间行车。","answer":false,"correction":"沥青路面缺点是使用年限较水泥路面短,易受天气影响,不利于夜间行车。","audit_note":"答案文件题号后多了一个冒号，答案完整。"},{"id":"J287","type":"judge","num":287,"stem":"路面垫层一般在路基排水良好或有冻涨翻浆的路段设置。","answer":false,"correction":"路面垫层一般在路基排水不良或有冻涨翻浆的路段设置。"},{"id":"J288","type":"judge","num":288,"stem":"路肩由垫层、基层和面层组成。","answer":false,"correction":"路面由垫层、基层和面层组成。","content_fix":"2026-11-17 内容复核订正：原改句『与题干逐字相同（主语为路肩）』→『路面由垫层、基层和面层组成』；依据：由面层、基层、垫层组成是路面结构的标准表述，本题错点在主语「路肩」应为「路面」，原改句未改。"},{"id":"J289","type":"judge","num":289,"stem":"对于轻交通道路来说，其路肩的面层材料选用沥青混合材料或水泥混凝土比较合适。","answer":false,"correction":"对于重或特重交通道路来说,其路肩的面层材料选用沥青混合材料或水泥混凝土比较合适。"},{"id":"J290","type":"judge","num":290,"stem":"影响路基路面的地面水包括大气降水、江、河、水渠、潜水等。","answer":false,"correction":"影响路基路面的地面水包括大气降水、江、河、水渠等。","content_fix":"2026-11-17 内容复核订正：原改句『与题干逐字相同（含潜水）』→『删去「潜水」的改句』；依据：潜水是埋藏在地表以下的地下水，不属于地面水，原改句未删出错点。"},{"id":"J291","type":"judge","num":291,"stem":"桥涵设计行车要求包括保证设计频率洪水安全宣泄、保证桥涵下足够的净空高度。","answer":false,"correction":"桥涵设计排水要求包括保证设计频率洪水安全宣泄、保证桥涵下足够的净空高度。"},{"id":"J292","type":"judge","num":292,"stem":"港口四个发展阶段中的第二阶段的港口发展的关键因素是劳动力和资本。","answer":false,"correction":"港口四个发展阶段中的第一阶段的港口发展的关键因素是劳动力和资本。"},{"id":"J293","type":"judge","num":293,"stem":"港口业务范围包括货物装卸、储存与船舶靠泊服务、货物加工、换装及与船舶有关的工商业服务，对应的港口发展阶段是第三阶段。","answer":false,"correction":"港口业务范围包括货物装卸、储存与船舶靠泊服务、货物加工、换装及与船舶有关的工商业服务,对应的港口发展阶段是第二阶段。"},{"id":"J294","type":"judge","num":294,"stem":"货物装卸属于港口的工业功能。","answer":false,"correction":"货物装卸属于港口的运输功能。"},{"id":"J295","type":"judge","num":295,"stem":"造船、修船属于港口的商业和贸易功能。","answer":false,"correction":"造船、修船属于港口的工业功能。"},{"id":"J296","type":"judge","num":296,"stem":"武汉港是典型的河口港。","answer":false,"correction":"武汉港是典型的河港。"},{"id":"J297","type":"judge","num":297,"stem":"上海港是典型的海港。","answer":false,"correction":"上海港是典型的河口港。"},{"id":"J298","type":"judge","num":298,"stem":"湖洲港是典型的湖港。","answer":false,"correction":"湖洲港是典型的运河港。"},{"id":"J299","type":"judge","num":299,"stem":"欧洲第二大港-鹿特丹港是一个典型的海港。","answer":false,"correction":"欧洲第一大港-鹿特丹港是一个典型的河口港。"},{"id":"J300","type":"judge","num":300,"stem":"自由之港-纽约港是美国最大的河口港,也是世界上天然深水港之一。","answer":false,"correction":"自由之港-纽约港是美国最大的海港,也是世界上天然深水港之一。"},{"id":"J301","type":"judge","num":301,"stem":"横滨港是日本最大的河港，也是欧洲最大的港口之一。","answer":false,"correction":"横滨港是日本最大的海港,也是亚洲最大的港口之一。"},{"id":"J302","type":"judge","num":302,"stem":"威尼斯港是德国最大港口，也是欧洲第一大集装箱港。","answer":false,"correction":"汉堡港是德国最大港口，也是欧洲第二大集装箱港。","content_fix":"2026-11-17 内容复核订正：原改句『威尼斯港是德国最大港口，也是欧洲第二大集装箱港』→『汉堡港是德国最大港口，也是欧洲第二大集装箱港』；依据：威尼斯港在意大利、根本不是德国港口，原改句只改了「第一→第二」，主语错误未动，改完仍全错。"},{"id":"J303","type":"judge","num":303,"stem":"摩尔曼斯克港是太平洋考察站的前进基地和北方诸岛的后方基地。","answer":false,"correction":"摩尔曼斯克港是北冰洋考察站的前进基地和北方诸岛的后方基地。"},{"id":"J304","type":"judge","num":304,"stem":"人工航道是低潮位或低水位时水深已满足船舶航行需要而无需疏浚的航道。","answer":false,"correction":"天然航道是低潮位或低水位时水深已满足船舶航行需要而无需疏浚的航道。"},{"id":"J305","type":"judge","num":305,"stem":"航速越小，船舶与航道侧壁间富裕宽度应越大。","answer":false,"correction":"航速越大,船舶与航道侧壁间富裕宽度应越大。"},{"id":"J306","type":"judge","num":306,"stem":"单向航道的航道宽度一般为8B。","answer":false,"correction":"单向航道的航道宽度一般为5B。"},{"id":"J307","type":"judge","num":307,"stem":"通常状况下，航道水深一般要求为满载吃水的2倍。","answer":false,"correction":"通常状况下,航道水深一般要求为满载吃水的1.1倍。"},{"id":"J308","type":"judge","num":308,"stem":"锚地应设置在船舶作业和船舶往来区域以内的水域，避开强流影响。","answer":false,"correction":"锚地应设置在船舶作业和船舶往来区域以外的水域,避开强流影响。"},{"id":"J309","type":"judge","num":309,"stem":"锚地底部的土质最好是淤泥质砂土，其次是软硬适度的亚砂土或亚粘土。","answer":false,"correction":"锚地底部的土质最好是软硬适度的亚砂土或亚粘土,其次是淤泥质砂土。"},{"id":"J310","type":"judge","num":310,"stem":"单浮筒系泊方式的船受力小，可随风、水流等转动，但占水域面积很大，且各锚地间浪费一定的水域。","answer":false,"correction":"单锚系泊方式的船受力小,可随风、水流等转动,但占水域面积很大,且各锚地间浪费一定的水域。"},{"id":"J311","type":"judge","num":311,"stem":"双浮筒系泊方式可以增加锚的系留力和减少船舶的偏荡。","answer":false,"correction":"双锚系泊方式可以增加锚的系留力和减少船舶的偏荡。"},{"id":"J312","type":"judge","num":312,"stem":"无掩护的开敞水域或港作拖轮条件差的港口，回旋水域的直径为2Lc。","answer":false,"correction":"无掩护的开敞水域或港作拖轮条件差的港口,回旋水域的直径为2.5Lc。"},{"id":"J313","type":"judge","num":313,"stem":"船舶自行掉头的，回旋水域的直径为1.5Lc。","answer":false,"correction":"船舶自行掉头的,回旋水域的直径为3Lc。"},{"id":"J314","type":"judge","num":314,"stem":"突堤指的是两端不与岸相连,位于离岸一定距离，有两个堤头，没有堤根。","answer":false,"correction":"岛堤指的是两端不与岸相连,位于离岸一定距离,有两个堤头,没有堤根。"},{"id":"J315","type":"judge","num":315,"stem":"直立式防波堤适用于水深不大处。","answer":false,"correction":"斜坡式防波堤适用于水深不大处。"},{"id":"J316","type":"judge","num":316,"stem":"喷气堤指的是利用水泵，通过安置在水面的喷嘴喷射水流，以达到消减波能的装置。","answer":false,"correction":"射水堤指的是利用水泵,通过安置在水面的喷嘴喷射水流,以达到消减波能的装置。"},{"id":"J317","type":"judge","num":317,"stem":"广义上的码头指的是是海边、江河边供船舶停泊，以装卸货物、上下旅客和进行有关专业性作业的构筑物。","answer":false,"correction":"狭义上的码头指的是是海边、江河边供船舶停泊,以装卸货物、上下旅客和进行有关专业性作业的构筑物。"},{"id":"J318","type":"judge","num":318,"stem":"码头按照运输对象分为通用码头、货主码头。","answer":false,"correction":"码头按照隶属关系分为通用码头、货主码头。"},{"id":"J319","type":"judge","num":319,"stem":"集装箱码头装卸作业地带泊位多采用单泊位布置，而非成组多泊位直线布置。","answer":false,"correction":"集装箱码头装卸作业地带泊位多采用成组多泊位直线布置,而非单泊位。"},{"id":"J320","type":"judge","num":320,"stem":"滚装码头在布置的时候若只有一个泊位时，采用折线布置；多个泊位时，布置在转角处。","answer":false,"correction":"滚装码头在布置的时候若只有一个泊位时,布置在转角处;多个泊位时,采用折线布置。"},{"id":"J321","type":"judge","num":321,"stem":"合理布置作业地带，安排足够的地带宽度可以减慢货物的装卸，增长船舶的停靠时间。","answer":false,"correction":"合理布置作业地带,安排足够的地带宽度可以加快货物的装卸,缩短船舶的停靠时间。"},{"id":"J322","type":"judge","num":322,"stem":"飞机跑道的方位应垂直于主导风向布置。","answer":false,"correction":"飞机跑道的方位应平行于主导风向布置。"},{"id":"J323","type":"judge","num":323,"stem":"机场系统的纵断面设计中，跑道的纵坡度应尽可能平缓，并且尽可能避免坡度变化。","answer":true,"correction":"","audit_note":"答案文件的原句与本题题面不一致，其改句与题面完全相同——本题题面本身正确，已按 √ 处理。"},{"id":"J324","type":"judge","num":324,"stem":"机场系统的横坡设计中，跑道的横坡度应足够小，以满足道面表面排水的需要。","answer":false,"correction":"机场系统的横坡设计中,跑道的横坡度应足够大,以满足道面表面排水的需要。"},{"id":"J325","type":"judge","num":325,"stem":"机场系统中的升降带要求地面平整，升降带内需要各种各样的急救设备。","answer":false,"correction":"机场系统中的升降带要求地面平整,除了必需的助航设备外,不应有危及飞机安全的物体。"},{"id":"J326","type":"judge","num":326,"stem":"滑行道应尽量多转向。","answer":false,"correction":"滑行道应尽量少转向。"},{"id":"J327","type":"judge","num":327,"stem":"出口滑行道设置成直角时，由于转角大，飞机进入出口滑行道之前的速度必须加快 var W=[0.212,1.2931,2.3065,8.2956,6.4133,0.8334,3.0194,0.001,1.8722,0.1666,0.796,1.4835,0.0614,0.2629,1.6483,0.6014,1.8729,0.5425,0.0912,0.0658,0.1542];
var DECAY=-W[20], FACTOR=Math.pow(0.9,1/DECAY)-1, DAY_MS=86400000, RELEARN_MS=600000;
function clamp(v,lo,hi){return Math.min(hi,Math.max(lo,v));}
function retrievability(elapsedDays,stability){ if(stability<=0) return 0; return Math.pow(1+(FACTOR*elapsedDays)/stability,DECAY); }
function initDifficulty(g){ return clamp(W[4]-Math.exp(W[5]*(g-1))+1,1,10); }
function initStability(g){ return Math.max(0.1,W[g-1]); }
function nextDifficulty(d,g){ var delta=-W[6]*(g-3); var damped=d+(delta*(10-d))/9; var target=initDifficulty(4); return clamp(W[7]*target+(1-W[7])*damped,1,10); }
function stabilityAfterLapse(d,s,r){ var sf=W[11]*Math.pow(d,-W[12])*(Math.pow(s+1,W[13])-1)*Math.exp(W[14]*(1-r)); return clamp(Math.min(sf,s),0.1,36500); }
function stabilityAfterRecall(d,s,r,g){ var hp=g===2?W[15]:1, eb=g===4?W[16]:1; var sr=s*(1+Math.exp(W[8])*(11-d)*Math.pow(s,-W[9])*(Math.exp(W[10]*(1-r))-1)*hp*eb); return clamp(sr,0.1,36500); }
function shortTermStability(s,g){ var inc=Math.exp(W[17]*(g-3+W[18])); var next=s*inc*Math.pow(s,-W[19]); if(g>=3) next=Math.max(next,s); return clamp(next,0.1,36500); }
function intervalFor(stability,retention){ var r=clamp(retention||0.93,0.8,0.97); var ivl=(stability/FACTOR)*(Math.pow(r,1/DECAY)-1); return Math.max(1,Math.round(ivl)); }
function applyGrade(st,grade,now,retention){
  var isNew=st.reps===0;
  var elapsedDays=st.lastAt?Math.max(0,(now-st.lastAt)/DAY_MS):0;
  var difficulty,stability;
  if(isNew){ difficulty=initDifficulty(grade); stability=initStability(grade); }
  else{
    difficulty=nextDifficulty(st.d,grade);
    if(elapsedDays<1){ stability=shortTermStability(st.s,grade); }
    else{ var r=retrievability(elapsedDays,st.s); stability=grade===1?stabilityAfterLapse(difficulty,st.s,r):stabilityAfterRecall(difficulty,st.s,r,grade); }
  }
  var isLongSuccess=!isNew&&elapsedDays>=7&&grade>=2;
  if(grade===1) return {difficulty:difficulty,stability:stability,dueAt:now+RELEARN_MS,intervalDays:0,elapsedDays:elapsedDays,isLongSuccess:false};
  var iv=intervalFor(stability,retention);
  return {difficulty:difficulty,stability:stability,dueAt:now+iv*DAY_MS,intervalDays:iv,elapsedDays:elapsedDays,isLongSuccess:isLongSuccess};
}
function formatInterval(d){ if(d<=0) return "10分钟"; if(d<30) return d+"天"; if(d<365) return (d/30).toFixed(1).replace(/\.0$/,"")+"个月"; return (d/365).toFixed(1).replace(/\.0$/,"")+"年"; }
function isMastered(st,now){ if(!st||st.reps===0) return false; if(st.s<21) return false; if(st.longOk<3) return false; if(!st.lastAt) return false; return retrievability((now-st.lastAt)/DAY_MS,st.s)>=0.95; }
function statusOf(st,now){ if(!st||st.reps===0) return "new"; return isMastered(st,now)?"mastered":"learning"; }

var idbDb=null;
function idbOpen(){ return new Promise(function(res,rej){ try{ var rq=indexedDB.open("stx-web",1); rq.onupgradeneeded=function(){ rq.result.createObjectStore("kv"); }; rq.onsuccess=function(){ idbDb=rq.result; res(idbDb); }; rq.onerror=function(){ rej(rq.error); }; }catch(e){ rej(e); } }); }
function idbGet(key){ return new Promise(function(res){ if(!idbDb){ res(null); return; } try{ var rq=idbDb.transaction("kv","readonly").objectStore("kv").get(key); rq.onsuccess=function(){ res(rq.result||null); }; rq.onerror=function(){ res(null); }; }catch(e){ res(null); } }); }
function idbSet(key,val){ try{ if(idbDb) idbDb.transaction("kv","readwrite").objectStore("kv").put(val,key); }catch(e){} }
var saveTimer=null;
function save(){
  S.updatedAt=Date.now();
  var raw=JSON.stringify(S);
  try{ localStorage.setItem(LS_KEY,raw); }catch(e){}
  idbSet("state",raw);
}
function saveSoon(){ if(saveTimer) clearTimeout(saveTimer); saveTimer=setTimeout(save,250); }
function loadState(){
  var best=null;
  try{ var raw=localStorage.getItem(LS_KEY); if(raw){ var o=JSON.parse(raw); if(o&&o.version===1) best=o; } }catch(e){}
  return idbOpen().then(function(){ return idbGet("state"); }).then(function(raw2){
    if(raw2){ try{ var o2=JSON.parse(raw2); if(o2&&o2.version===1&&(!best||(o2.updatedAt||0)>(best.updatedAt||0))) best=o2; }catch(e){} }
    if(best){ S=best; if(!S.settings) S.settings=defaultSettings(); if(!S.cards) S.cards={}; if(!S.history) S.history={}; }
    if(navigator.storage&&navigator.storage.persist){ navigator.storage.persist().catch(function(){}); }
  }).catch(function(){});
}

function shuffle(a){ var arr=a.slice(); for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; } return arr; }

/* ============ 全局统计 ============ */
function stats(now){
  var mastered=0,learning=0,fresh=0,wrong=0,fav=0,due=[];
  BANK.forEach(function(q){ var c=cardOf(q.id); var st=statusOf(c,now);
    if(st==="mastered") mastered++; else if(st==="learning") learning++; else fresh++;
    if(c){ if(c.wrong>0) wrong++; if(c.fav) fav++; if(c.reps>0&&c.due<=now) due.push(q.id); }
  });
  return {mastered:mastered,learning:learning,fresh:fresh,wrong:wrong,fav:fav,due:due};
}
function sortReviews(ids,now){
  var order=S.settings.reviewOrder;
  var arr=ids.slice();
  if(order==="due") arr.sort(function(a,b){ return cardOf(a).due-cardOf(b).due; });
  else if(order==="random") arr=shuffle(arr);
  else arr.sort(function(a,b){ var ca=cardOf(a),cb=cardOf(b); var ra=retrievability(Math.max(0,(now-ca.lastAt)/DAY_MS),ca.s), rb=retrievability(Math.max(0,(now-cb.lastAt)/DAY_MS),cb.s); return ra-rb; });
  return arr;
}
function sortNew(ids){
  var order=S.settings.newOrder;
  if(order==="random") return shuffle(ids);
  if(order==="topic") return ids.slice().sort(function(a,b){ var ta=TOPICS.indexOf(QMAP[a].topic),tb=TOPICS.indexOf(QMAP[b].topic); if(ta!==tb) return ta-tb; return QMAP[a].num-QMAP[b].num; });
  return ids;
}
function planInfo(now){
  var st=stats(now);
  var set=S.settings;
  var reviews=sortReviews(st.due,now);
  if(set.reviewLimit>=0) reviews=reviews.slice(0,set.reviewLimit);
  var doneNew=histToday().newDone||0;
  var newQuota=Math.max(0,set.newLimit-doneNew);
  var freshIds=BANK.filter(function(q){ var c=cardOf(q.id); return !c||c.reps===0; }).map(function(q){ return q.id; });
  var news=sortNew(freshIds).slice(0,newQuota);
  return {reviewTotal:st.due.length,reviews:reviews,news:news,freshTotal:freshIds.length,doneNew:doneNew,st:st};
}
function buildTodayQueue(now){
  var p=planInfo(now), org=S.settings.organize, q=[];
  if(org==="new-first") q=p.news.concat(p.reviews);
  else if(org==="mix"){ var r=p.reviews.slice(),n=p.news.slice(); while(r.length||n.length){ for(var i=0;i<5&&r.length;i++) q.push(r.shift()); if(n.length) q.push(n.shift()); } }
  else q=p.reviews.concat(p.news);
  return q;
}

function startMode(mode){
  var now=Date.now(), st=stats(now), ids;
  if(mode==="today2"||mode==="today") return startToday();
  if(mode==="seq") ids=BANK.map(function(q){ return q.id; });
  else if(mode==="random") ids=shuffle(BANK.map(function(q){ return q.id; }));
  else if(mode==="new") ids=sortNew(BANK.filter(function(q){ var c=cardOf(q.id); return !c||c.reps===0; }).map(function(q){ return q.id; }));
  else if(mode==="review") ids=sortReviews(st.due,now);
  else if(mode==="wrong"){ ids=BANK.filter(function(q){ var c=cardOf(q.id); return c&&c.wrong>0; }).sort(function(a,b){ return cardOf(b.id).wrong-cardOf(a.id).wrong; }).map(function(q){ return q.id; }); }
  else if(mode==="fav") ids=BANK.filter(function(q){ var c=cardOf(q.id); return c&&c.fav; }).map(function(q){ return q.id; });
  else if(mode==="exam") return newSession("exam","全量模考",shuffle(BANK.map(function(q){ return q.id; })),true);
  else if(mode==="sim") return startSim();
  else return;
  var titles={seq:"顺序练习",random:"随机练习",new:"只练新题",review:"到期复习",wrong:"错题练习",fav:"收藏练习"};
  newSession(mode,titles[mode]||"练习",ids,false);
}
/* 按专题轮转抽题：先把每个专题洗牌，再逐专题轮流取，保证覆盖面 */
function sampleByTopic(qs,n){
  var byTopic={};
  qs.forEach(function(q){ (byTopic[q.topic]||(byTopic[q.topic]=[])).push(q); });
  var groups=TOPICS.filter(function(t){ return byTopic[t]&&byTopic[t].length; }).map(function(t){ return shuffle(byTopic[t]); });
  var out=[];
  while(out.length<n){
    var moved=false;
    for(var i=0;i<groups.length&&out.length<n;i++){ if(groups[i].length){ out.push(groups[i].shift()); moved=true; } }
    if(!moved) break;
  }
  return out;
}
function startSim(){
  var cIds=sampleByTopic(BANK.filter(function(q){ return q.type==="choice"; }),15).map(function(q){ return q.id; });
  var jIds=sampleByTopic(BANK.filter(function(q){ return q.type==="judge"; }),15).map(function(q){ return q.id; });
  newSession("sim","考试模拟",cIds.concat(jIds),true);
}
function startTopic(t){
  var now=Date.now(), qs=BANK.filter(function(q){ return q.topic===t; });
  var due=sortReviews(qs.filter(function(q){ var c=cardOf(q.id); return c&&c.reps>0&&c.due<=now; }).map(function(q){ return q.id; }),now);
  var fresh=qs.filter(function(q){ var c=cardOf(q.id); return !c||c.reps===0; }).map(function(q){ return q.id; });
  var rest=qs.filter(function(q){ var c=cardOf(q.id); return c&&c.reps>0&&c.due>now; }).map(function(q){ return q.id; });
  newSession("topic","专题 · "+t,due.concat(fresh,rest),false);
}
function startSingle(id){ newSession("single","单题练习",[id],false); }
function exitQuiz(){ if(QZ&&!QZ.done) saveSessionSnap(); stopTimer(); QZ=null; view="today"; renderApp(); window.scrollTo(0,0); }
function exitToTab(t){ stopTimer(); QZ=null; view=t; renderApp(); window.scrollTo(0,0); }

function curSlot(){ return QZ.queue[QZ.pos]; }
function curQ(){ return QMAP[curSlot().qid]; }
function isCommitted(r){ return !!r&&(QZ.exam?true:r.grade!=null); }
function pickOpt(k){
  var r=QZ.results[QZ.pos]; if(r&&!QZ.exam) return;
  var q=curQ(), d=(QZ.drafts[QZ.pos]||[]).slice();
  if(q.type==="choice"&&q.multi){
    var i=d.indexOf(k); if(i>=0) d.splice(i,1); else d.push(k); QZ.drafts[QZ.pos]=d;
    if(QZ.exam){ if(d.length) judge(); else { delete QZ.results[QZ.pos]; saveSessionSnap(); renderQuizBody(); } }
    else renderQuizBody();
  }
  else{ QZ.drafts[QZ.pos]=[k]; judge(); }
}
function pickJudge(v){ var r=QZ.results[QZ.pos]; if(r&&!QZ.exam) return; QZ.drafts[QZ.pos]=[v?"T":"F"]; judge(); }
function judge(){
  var q=curQ(), sel=(QZ.drafts[QZ.pos]||[]).slice(), correct;
  if(q.type==="choice"){ var a=q.answer.slice().sort().join(","), b=sel.slice().sort().join(","); correct=a===b; }
  else correct=(sel[0]==="T")===q.answer;
  QZ.results[QZ.pos]={sel:sel,correct:correct,grade:null,before:undefined,spawned:null,hist:null};
  if(QZ.exam){ saveSessionSnap(); }
  renderQuizBody();
}
function commitGrade(g){
  var pos=QZ.pos, r=QZ.results[pos]; if(!r||r.grade!=null) return;
  var q=curQ(), now=Date.now();
  var existing=cardOf(q.id);
  r.before=existing?JSON.parse(JSON.stringify(existing)):null;
  var wasNew=!existing||existing.reps===0;
  var out=applyGrade(existing||emptyCard(),g,now,S.settings.retention);
  var c=ensureCard(q.id);
  c.d=out.difficulty; c.s=out.stability; c.due=out.dueAt; c.reps+=1;
  if(g===1) c.lapses+=1;
  if(!r.correct) c.wrong+=1;
  if(out.isLongSuccess) c.longOk+=1;
  c.lastGrade=g; c.lastAt=now;
  var ht=histToday(); ht.reviews+=1; if(r.correct) ht.correct+=1; if(wasNew) ht.newDone+=1;
  r.hist={day:todayKey(),wasNew:wasNew,correct:r.correct};
  r.grade=g;
  if(!r.correct||g===1){ QZ.failed[q.id]=true; QZ.streak[q.id]=0; QZ.queue.push({qid:q.id,rq:true}); r.spawned=QZ.queue.length-1; }
  else if(QZ.failed[q.id]){ QZ.streak[q.id]=(QZ.streak[q.id]||0)+1; if(QZ.streak[q.id]>=2){ delete QZ.failed[q.id]; } else { QZ.queue.push({qid:q.id,rq:true}); r.spawned=QZ.queue.length-1; } }
  save(); saveSessionSnap();
  var nxt=nextUncommitted(pos);
  if(nxt===-1) finishSession(); else { QZ.pos=nxt; QZ.dir=1; saveSessionSnap(); renderApp(); window.scrollTo(0,0); }
}
function nextUncommitted(from){
  for(var i=from+1;i<QZ.queue.length;i++){ if(!isCommitted(QZ.results[i])) return i; }
  for(var j=0;j<from;j++){ if(!isCommitted(QZ.results[j])) return j; }
  return -1;
}
function revertSlot(i){
  var r=QZ.results[i]; if(!r) return;
  if(r.spawned!=null){
    if(QZ.results[r.spawned]) revertSlot(r.spawned);
    QZ.queue.splice(r.spawned,1);
    var nr={}; Object.keys(QZ.results).forEach(function(k){ var idx=parseInt(k,10); if(idx>r.spawned) nr[idx-1]=QZ.results[k]; else nr[idx]=QZ.results[k]; });
    QZ.results=nr;
    Object.keys(QZ.results).forEach(function(k){ var rr=QZ.results[k]; if(rr.spawned!=null&&rr.spawned>r.spawned) rr.spawned-=1; });
    var nd={}; Object.keys(QZ.drafts).forEach(function(k){ var idx=parseInt(k,10); nd[idx>r.spawned?idx-1:idx]=QZ.drafts[k]; });
    QZ.drafts=nd;
    if(QZ.pos>r.spawned) QZ.pos-=1;
    r=QZ.results[i]; if(!r) return;
  }
  if(r.grade!=null){
    if(r.before===null) delete S.cards[curSlotQid(i)]; else S.cards[curSlotQid(i)]=r.before;
    if(r.hist){ var rec=S.history[r.hist.day]; if(rec){ rec.reviews=Math.max(0,rec.reviews-1); if(r.hist.correct) rec.correct=Math.max(0,rec.correct-1); if(r.hist.wasNew) rec.newDone=Math.max(0,rec.newDone-1); } }
    if(!r.correct){ QZ.failed[curSlotQid(i)]=true; QZ.streak[curSlotQid(i)]=0; }
  }
  QZ.drafts[i]=r.sel.slice();
  delete QZ.results[i];
  save();
}
function curSlotQid(i){ return QZ.queue[i].qid; }
function modifyAnswer(){ revertSlot(QZ.pos); saveSessionSnap(); renderQuizBody(); }
function prevQ(){ if(QZ.pos>0){ QZ.pos--; QZ.dir=-1; saveSessionSnap(); renderApp(); window.scrollTo(0,0); } }
function nextQ(){
  var r=QZ.results[QZ.pos];
  if(!isCommitted(r)) return;
  var nxt=nextUncommitted(QZ.pos);
  if(nxt===-1){
    if(QZ.pos<QZ.queue.length-1){ QZ.pos++; QZ.dir=1; renderApp(); window.scrollTo(0,0); }
    else finishSession();
  } else { QZ.pos=nxt; QZ.dir=1; saveSessionSnap(); renderApp(); window.scrollTo(0,0); }
}
function finishSession(){
  /* 考试模拟交卷：不改 FSRS 调度，只把错题（含未答）记入错题统计 */
  if(QZ&&QZ.mode==="sim"&&!QZ.recorded){
    QZ.recorded=true;
    QZ.queue.forEach(function(slot,i){ var r=QZ.results[i]; if(!r||!r.correct) ensureCard(slot.qid).wrong+=1; });
    save();
  }
  QZ.done=true; QZ.elapsed=curElapsed(); stopTimer(); clearSession(); renderApp(); window.scrollTo(0,0);
}
function toggleFlag(){ var c=ensureCard(curQ().id); c.flag=!c.flag; save(); saveSessionSnap(); renderQuizHead(); }
function toggleFav(){ var c=ensureCard(curQ().id); c.fav=!c.fav; save(); renderQuizHead(); toast(c.fav?"已收藏":"已取消收藏"); }

/* ---- 做题页渲染 ---- */
function renderQuiz(){ document.getElementById("app").innerHTML=QZ.done?resultHTML():'<div id="quizRoot">'+quizHTML()+'</div>'; }
function renderQuizBody(){ var el=document.getElementById("quizRoot"); if(el) el.innerHTML=quizHTML(); }
function renderQuizHead(){ renderQuizBody(); }
function typeLabel(q){ if(q.type==="judge") return "判断改错"; return q.multi?"多选题":"单选题"; }
function quizHTML(){
  var q=curQ(), slot=curSlot(), r=QZ.results[QZ.pos], draft=QZ.drafts[QZ.pos]||[];
  var committed=Object.keys(QZ.results).filter(function(k){ return isCommitted(QZ.results[k]); }).length;

  var h='<div class="quiz-top"><div class="row"><button class="icon-btn" aria-label="退出" onclick="exitQuiz()">'+ic("x")+'</button><div style="flex:1;text-align:center"><div style="font-weight:600;font-size:15.5px">'+esc(QZ.title)+'</div><div style="color:var(--dim);font-size:12.5px" class="tnum"><span id="qTime">'+fmtTime(curElapsed())+'</span> · 已答 '+committed+' / '+QZ.queue.length+'</div></div>'
    +'<button class="icon-btn" aria-label="旗标" onclick="toggleFlag()" style="'+(c&&c.flag?"color:var(--accent)":"")+'">'+ic("flag")+'</button>'

  h+='<div class="'+(QZ.dir<0?"anim-q-b":"anim-q")+'">';
  h+='<div class="qmeta"><span>第 '+(QZ.pos+1)+' 题</span><span>·</span><span>'+typeLabel(q)+'</span><span>·</span><span>'+esc(q.topic)+'</span>'+(slot.rq?'<span>·</span><span style="color:var(--accent)">回炉重练</span>':"")+'<span class="spacer"></span><span class="tnum">'+q.id+'</span>'+fixTag(q)+'</div>';
  h+='<div class="qstem">'+esc(q.stem)+'</div>';
  if(q.images) q.images.forEach(function(p){ if(IMAGES[p]) h+='<img class="qimg" src="'+IMAGES[p]+'" alt="题目配图">'; });
  /* 选项 */
  if(q.type==="choice"){
    h+='<div class="opts">';
    q.options.forEach(function(o){
      var cls="opt", mark="";
      if(r&&!QZ.exam){
        if(q.answer.indexOf(o.key)>=0){ cls+=" ok"; mark='<span class="mark" style="color:var(--green)">'+ic("check","sm")+'</span>'; }
        else if(r.sel.indexOf(o.key)>=0){ cls+=" bad"; mark='<span class="mark" style="color:var(--red)">'+ic("x","sm")+'</span>'; }
        else cls+=" dim";
      } else if(draft.indexOf(o.key)>=0) cls+=" sel";
      h+='<button class="'+cls+'" onclick="pickOpt(\''+o.key+'\')"><span class="k">'+o.key+'</span><span style="flex:1">'+esc(o.text)+'</span>'+mark+'</button>';
    });
    h+='</div>';
    if(!r&&q.multi) h+='<button class="btn-primary" style="margin-top:14px" '+(draft.length?"":"disabled")+' onclick="judge()">确认答案</button>';
  } else {
    h+='<div class="judge-row">';
    [true,false].forEach(function(v){
      var key=v?"T":"F", cls="judge-btn", mark="";
      if(r&&!QZ.exam){
        var isAns=q.answer===v, picked=r.sel[0]===key;
        if(isAns){ cls+=" ok"; mark=ic("check","sm"); }
        else if(picked){ cls+=" bad"; mark=ic("x","sm"); }
        else cls+=" dim";
      } else if(draft[0]===key) cls+=" sel";
      h+='<button class="'+cls+'" onclick="pickJudge('+(v?"true":"false")+')">'+(v?"正确 √":"错误 ×")+' '+mark+'</button>';
    });
    h+='</div>';
  }
  /* 反馈 */
  if(r&&!QZ.exam) h+=feedbackHTML(q,r);
  if(r&&QZ.exam) h+='<p style="color:var(--dim);font-size:13.5px;margin-top:14px">'+(QZ.mode==="sim"?"已记录，可随时改答，交卷后统一出分。":"已记录答案，交卷后统一出分。")+'</p>';
  h+='</div>';
  /* 底部导航 */
  var canNext=isCommitted(r);
  var isLast=QZ.pos===QZ.queue.length-1;
  if(QZ.mode==="sim"){
    h+='<div class="quiz-nav"><div class="in"><button class="nav-btn" '+(QZ.pos===0?"disabled":"")+' onclick="prevQ()">'+ic("back","sm")+'上一题</button>'
      +'<button class="nav-btn" '+(isLast?"disabled":"")+' onclick="simNext()">下一题 '+ic("fwd","sm")+'</button>'
      +'<button class="nav-btn main" onclick="submitExam()">交卷</button></div></div>';
  } else {
    h+='<div class="quiz-nav"><div class="in"><button class="nav-btn" '+(QZ.pos===0?"disabled":"")+' onclick="prevQ()">'+ic("back","sm")+'上一题</button>'
      +'<button class="nav-btn main" '+(!canNext?"disabled":"")+' onclick="nextQ()">'+(isLast&&canNext?"完成":"下一题")+' '+ic("fwd","sm")+'</button></div></div>';
  }
  return h;
}
function feedbackHTML(q,r){
  var h='<div class="feedback anim-fade-up" style="animation:page-in .22s ease-out both"><div class="fh"><span class="dot '+(r.correct?"ok":"bad")+'">'+ic(r.correct?"check":"x","sm")+'</span>'+(r.correct?"答对了":"答错了")+'</div>';
  h+='<div class="ans">正确答案：<b>'+esc(answerText(q))+'</b>';
  if(q.type==="choice") h+='<span style="color:var(--dim)"> · '+q.options.filter(function(o){ return q.answer.indexOf(o.key)>=0; }).map(function(o){ return o.key+". "+esc(o.text); }).join("；")+'</span>';
  h+='</div>';
  if(q.type==="judge"&&q.correction) h+='<div class="corr">正确说法：'+esc(q.correction)+'</div>';
  if(q.audit_note) h+='<div class="note">注：'+esc(q.audit_note)+'</div>';
  if(q.content_fix) h+=fixNoteHTML(q);
  if(r.grade==null){
    var card=cardOf(q.id)||emptyCard(), now=Date.now();

    });

  } else {
    var labels2={1:"忘了",2:"模糊",3:"记得",4:"很熟"};

  }
  h+='</div>';
  return h;

  var f=QZ.cardFilter||"all";

    +'<div class="cardgrid">';

}
function cardFilter(f){ QZ.cardFilter=f; openCard(); }
function jumpTo(i){ closeLayer(); QZ.dir=i<QZ.pos?-1:1; QZ.pos=i; saveSessionSnap(); renderApp(); window.scrollTo(0,0); }

/* ---- 结算 ---- */

        +'<div style="color:var(--dim);font-size:14px;margin-top:5px;line-height:1.65;padding-left:25px">你的答案：<span style="color:'+(ok?"var(--text)":"var(--red)")+'">'+esc(mine)+'</span> · 正确答案：<b style="color:var(--text)">'+esc(answerText(q))+'</b>'
        +(q.type==="choice"?'<br>'+q.options.filter(function(o){ return q.answer.indexOf(o.key)>=0; }).map(function(o){ return o.key+". "+esc(o.text); }).join("；"):"")
        +(q.type==="judge"&&q.correction?'<br>正确说法：'+esc(q.correction):"")

function restartSession(){ var m=QZ.mode,t=QZ.title,ids=QZ.baseIds,ex=QZ.exam; QZ=null; stopTimer(); newSession(m,t,ids,ex); }

/* ---- 考试模拟：线性导航与交卷 ---- */
function simNext(){ if(QZ.pos<QZ.queue.length-1){ QZ.pos++; QZ.dir=1; saveSessionSnap(); renderApp(); window.scrollTo(0,0); } }
function submitExam(){
  var answered=Object.keys(QZ.results).length, left=QZ.queue.length-answered;
  if(left>0){
    showModal("还有 "+left+" 题未答","未答的题按 0 分计，确定现在交卷吗？",[
      {label:"继续答题",cls:"pri",fn:"closeModal()"},
      {label:"确认交卷",cls:"",fn:"closeModal();finishSession()"}
    ]);
  } else finishSession();
}
function practiceSimWrong(){
  var ids=[]; QZ.queue.forEach(function(slot,i){ var r=QZ.results[i]; if(!r||!r.correct) ids.push(slot.qid); });
  QZ=null; stopTimer(); newSession("simwrong","模拟错题练习",ids,false);
}
function retakeSim(){ QZ=null; stopTimer(); startMode("sim"); }

/* ============ 启动 ============ */
loadState().then(function(){ renderApp(); });
</script>
